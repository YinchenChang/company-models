    inputs: {"INP_114": 20}
  - id: t_eta_rise
    description: η 路徑開關 0 → 1（線性回升至 2030＝1）：2026 起有效推論 GW 下降、研發 GW 上升
    inputs: {"INP_117": 1}
  - id: u_nnv_out_low
    description: Tokenomics NonNV 產出比取低值（TPU v7 0.8 → 0.6、Trainium3 0.5 → 0.3）：TPU／Trainium 每 GW 產能與 VR 等值係數下降
    inputs: {"TK_NNV_TPUv7_Out": 0.6, "TK_NNV_Trn3_Out": 0.3}
  - id: v_headcount_high
    description: 2026 員工人數年增率 0.8 → 1.2（Inputs 上緣）：非算力成本與股權報酬上升
    inputs: {"INP_156": 1.2}
  - id: w_owned_capex_half
    description: 自建（Fluidstack）總額 $50B → $25B：自有資本支出與自建 GW 減半
    inputs: {"SRC_ANT_212": 25}
  - id: x_pue_facility
    description: 口徑未明的揭露 GW 全部視為設施口徑（0 → 1），PUE 1.2 → 1.3：雙揭露型與 GW 型合約的 IT GW 下降
    inputs: {"INP_124": 1, "TK_PUE": 1.3}
  - id: y_broadcom_5gw_ramp3
    description: Google／Broadcom 容量改採公司自述 5 GW（開關 0 → 1），爬坡年數 2 → 3
    inputs: {"INP_128": 1, "INP_122": 3}
  - id: z_training_low_cap
    description: 2025 訓練支出 4.1 → 1.0：推論支出換算 GW 上升、η 降至約 0.3（η WARN），2027 起有效推論超過可用 GW → 容量上限 < 1、營收截頂
    inputs: {"SRC_ANT_253": 1.0}
    expect_warn: true
  - id: za_legacy_mix_broken
    description: 既有雲端組合 Trainium2 0.4 → 0.8、Hopper 0.1 → 0.3（TPU v6e 餘額 < 0；組合檢查與 Inputs 區間應 ERR）
    inputs: {"INP_125": 0.8, "INP_126": 0.3}
    expect_err: [a3_lmix, inp_order]
  - id: zb_sbc_too_high
    description: 每人股權報酬 0.8 → 3（$M）：2025 股權報酬超過說明書非算力費用（非算力 ≤0 應 ERR；Inputs 區間 ERR）
    inputs: {"INP_162": 3}
    expect_err: [a3_ncx25, inp_order]
  # ── v0.1（A4）：Funding、Reverse（工作單 A4 第 3 步：parity 情境 ≥4 ＋ 檢查有牙齒）
  - id: fa_min_cash_12
    description: 最低現金月數 6 → 12（D17 區間上緣）：最低現金加倍、現金餘裕下降
    inputs: {"INP_165": 12}
  - id: fb_cond_in_base
    description: 條件式融資與 IPO 計入基準（開關 0 → 1）：2026 股權流入 ＋100（IPO）、2027 ＋50（Amazon、Google、AMD）
    inputs: {"INP_169": 1}
  - id: fc_funding_switches
    description: Microsoft $5B 另計 2026（0 → 1）、Amazon Series G $5B 不另計（1 → 0）、Google 即時 $10B 另計（0 → 1）：已到位融資 100 → 110
    inputs: {"INP_167": 1, "INP_166": 0, "INP_168": 1}
  - id: fd_no_2026_rounds
    description: Series G、Series H 改為 0（壓力測試）：只剩 Amazon G $5B，2027 起現金低於最低現金 → 外部資金需求、缺口旗標、首次缺口年、峰值有值
    inputs: {"SRC_ANT_298": 0, "SRC_ANT_302": 0}
  - id: fe_target_2029_alt
    description: 管理層 2029 營收目標 148 → 100：Reverse 倍數、反向自由現金流與反向外部資金改變（基準不變）
    inputs: {"SRC_ANT_370": 100}
  - id: ff_ipo_lease_2027
    description: IPO 到位年 2026 → 2027、機房租金起算 2028 → 2027：S1、S3 情境與租金敏感度改變
    inputs: {"INP_170": 2027, "INP_175": 2027}
  - id: fg_min_cash_negative
    description: 最低現金月數 → −1（最低現金 ≤ 0 應 ERR；Inputs 區間 ERR）
    inputs: {"INP_165": -1}
    expect_err: [a4_mincash, inp_order]
  # ── v0.1.1（工作單 20261021）：U1、U2、U6 各一，另加回歸開關與檢查有牙齒
  - id: ga_u1_q4_growth
    description: U1 Q4 營收相對 Q3 成長 0 → 0.4483（＝Q3／Q2 − 1，區間上緣）：2026 營收基準 49.9 → 56.6，API 倒推、2027 起任務成長基數與 Funding 隨之改變
    inputs: {"INP_181": 0.4483}
  - id: gb_u2_switch_off
    description: U2 開關 1 → 0（Nscale＋Lambda 回到 v0.1 的各自公告值：Nscale 雙揭露 45、Lambda GW 型 35）：2027 起供給 GW、合約實付、Cost 對帳與敏感度 A 改變
    inputs: {"INP_182": 0}
  - id: gc_u6_neg_early_short
    description: U6 談判中 $150B 起始年 2028 → 2027、付款期間 7 → 5 年：情境付款、新增 GW、含新協議的差額與 Funding S8 改變（基準不變）
    inputs: {"INP_185": 2027, "INP_186": 5}
  - id: gd_u1_switch_off
    description: U1 開關 1 → 0（回到 v0.1 的 D15 r1：Q1＋Q2＋2026-07 年化 × 6／12 ＝ 48.7）：2026 基準、API 倒推與其後各年改變
    inputs: {"INP_180": 0}
  - id: ge_u6_term_short
    description: U6 付款期間 7 → 1 年（短於爬坡年數 2；Σ 權重公式不成立 → b1_u6_term 與 Inputs 區間應 ERR）
    inputs: {"INP_186": 1}
