  - id: hb_u2_nscale_mw_up
    description: Nscale 揭露容量 460 → 600 MW（SRC_ANT_222）：U2 新法的供給 GW 改變（揭露容量），同時 MW 比例改變『最高 86』在兩約間的分攤與付款；供給 VR 等值 GW、合約實付、隱含每 GW 年付款與命題差額改變
    inputs: {"SRC_ANT_222": 600}
