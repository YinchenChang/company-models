# Parity 情境檔（CLAUDE.md 第 3 節）。每個情境：改寫輸入 → LibreOffice 重算（基準）→ 與 engine 比對全部公式格。
# 輸入一律以具名範圍設定（SRC_ANT_nnn、INP_nnn、TK_*）。v0.1-A2：Demand、Revenue、Checks 由情境驅動；v0.1-A3 加 Compute、Cost。
# expect_err：該情境必須讓這些檢查轉 ERR（保證檢查有牙齒）；expect_warn：CHK_Warnings ≥ 1。
workbook_expectations:            # 版本升級時必須有意識地更新（CLAUDE.md 第 4 節）
  sheets: [README, SRC_ANT, TK_Link, OAI_Link, Inputs, Demand, Revenue, Compute, Cost, Bridge, EtaDiag, Funding, Reverse, Checks, _Defaults]
  formula_cells: 7223             # v0.1.3 B：＋Bridge 頁與 EtaDiag 頁（唯讀）＋Checks C143–C152；v0.1.2：v0.1.1 的 5,834 ＋ Cost 第二十一節 16 列（TK L1_RevGW_PQ_VR200 對照）＋ Checks 3 列＋Cost／Checks 欄位格；v0.1.1：v0.1 的 5,491 ＋ 回歸開關與 U3–U7 新列（Revenue h1act、Compute U2 對照與 _old 列、Cost 第十六–十九節、Funding U7 與 S8）＋ Checks C106–C123
  defined_names: 1271              # v0.1.3 B：＋TK_ 對照名稱 22（IF_UtilActual、L1_TokGW_PaidCap_VR200、L1_Gap*）＋ETA_ 6（Eta、fP、fU、fW、Prod、Resid）；v0.1.2：＋TK_ 對照名稱 14（L1_RevGW_PQ_VR200 系列、L1_TokGW_PaidPQ_VR200 系列、L1_TokLedger_2026Q2、L1_M）＋COST_TKPQ、COST_TKPQRatio、COST_TKTokLedger；v0.1.1：＋SRC_ANT 30 列的名稱（值／下限／上限）、Inputs 7、COST_* 與 CMP_* 與 FND_* 新名
  src_rows: 409                   # A1 376＋A2 新增 3（SRC_ANT_377–379）＋v0.1.1 新增 30（SRC_ANT_380–409）
  src_named: 358                  # 有值欄的列才有 SRC_ANT_nnn 名稱（另有 _Lo／_Hi／_Date）；v0.1.1 新增 28 列有值（2 列定性）
  inp_rows: 190                   # INP_001–186；INP_016（A2 容量上限佔位）、INP_067–069 退役；v0.1.1 新增 INP_180–186
  base_warnings: 2                # v0.1.1：C89 逐家合約總額對招股書（AMD ×3.9）＋C116 U4 模型算力成本（含自建資本支出）對報導外推全年 +47%（U4 口徑未明）
  tk_values: 104                  # v0.1.3 B：＋22（η 診斷對照名稱）；OpenAI v0.6 同一組 63 名＋A2 新增 5 名（IF_HdrTask、IF_TaskLen、IF_TaskTokFresh／Cached／Dec）＋v0.1.2 新增 14 名（Tokenomics v18.0 對照名稱，只對照）
  tk_nonnv: 18                    # TK_NNV_*（TPU v7、Trainium3、MI455X × 6；讀表，非具名）
  oai_names: 21                   # OAI_ 17 個逐年名稱＋4 個中繼資料
  tk_pending: 0

scenarios:
  - id: base
    description: 基準（不改任何輸入）
    inputs: {}
  - id: a_elasticity_high
    description: API 任務數價格彈性 −0.7 → −1.05（區間下緣；2027 起 token 與營收改變）
    inputs: {"INP_096": -1.05}
  - id: b_partner_fee_high
    description: 雲端平台抽成率 0.16 → 0.30（Inputs 上緣，BofA 推得）；2026 起抽成與淨額改變，總額不變
    inputs: {"INP_100": 0.3}
  - id: c_channel_share_up
    description: 雲端通路占 API 營收 ＋15 個百分點（通路分成情境）
    inputs: {"INP_099": 0.15}
  - id: d_plan_mix_max
    description: 2026 起 Pro 占個人付費 0.70 → 0.55（方案組合：Max 占比上升；2026 API 倒推值隨之下降、2027 起訂閱上升）
    inputs: {"INP_023": 0.55}
  - id: e_task_growth_low
    description: 2027 API 任務數成長 0.45 → 0.225（任務成長情境）
    inputs: {"INP_092": 0.225}
  - id: f_price_decline_steep
    description: 2027 起牌價年變動 −15% → −35%（價格與彈性共同作用）
    inputs: {"INP_098": -0.35}
  - id: g_consumer_share_high
    description: 消費者訂閱占 2025 營收 15% → 20%（SRC Analogy 上緣）：個人訂閱 0.92 > 訂閱合計 0.789，席位轉負（倒推檢查應 ERR）
    inputs: {"SRC_ANT_063": 0.2}
    expect_err: [a2_backsolve]
  - id: h_api_mix_broken
    description: 2026 起 API Haiku 占比 0.15 → 0.6，使 Haiku＋Sonnet > 1（組合檢查應 ERR）
    inputs: {"INP_079": 0.6}
    expect_err: [a2_mix]
  - id: k_runrate_alt
    description: 2026-07 年化營收 65 → 79.5（YipitData 第三方估計）：2026 半校準基準與 API 倒推改變
    inputs: {"SRC_ANT_023": 79.5}
  - id: l_opus55_price
    description: Opus 5.5 輸入牌價 4 → 3：2026 頂層加權牌價與 2027 起價格路徑改變
    inputs: {"SRC_ANT_111": 3}
  - id: m_tk_nonnv_broken
    description: TPU v7 產出比基準 0.8 → 1.2（高於高值 1.1；NonNV 快照順序檢查應 ERR）
    inputs: {"TK_NNV_TPUv7_Out": 1.2}
    expect_err: [tk_nnv_order]
  - id: n_event_date_broken
    description: Opus 5.5 公告日改為早於 Opus 5（價格事件順序檢查應 ERR；2026 加權牌價改變）
    inputs: {"SRC_ANT_111_Date": 46100}
    expect_err: [a2_evorder]
  - id: o_rev2025_alt
    description: 2025 認列營收 4.6 → 4.59（另一來源）：其他營收殘差與 2025 總額改變，校準差仍為 0
    inputs: {"SRC_ANT_001": 4.59}
  - id: p_runrate_warn
    description: 2026-07 年化營收 65 → 150：v0.1.1 起 2026 模型營收改用 H1 與 Q3 實際（不再依 2026-07 年化），故改成里程碑推估遠高於模型（> 25% → WARN，不 ERR）
    inputs: {"SRC_ANT_023": 150}
    expect_warn: true
  - id: q_code_tokens
    description: 程式代理每任務 token 倍數（相對 Tokenomics 長程任務）0.15 → 0.4（區間上緣；只改 token，不改營收）
    inputs: {"INP_106": 0.4}
  - id: r_tk_task_tokens
    description: Tokenomics 快照：各任務每次嘗試快取 token ×（Coding agent 1,263,600 → 2,000,000）；程式代理 token 與 API 以外的 token 改變
    inputs: {"TK_IF_TaskTokCached[5]": 2000000}
  # ── v0.1-A3：Compute、Cost（工作單 A3 第 4 步：合約價、η、產出比、人數成長、自有資本支出、PUE ＋ 檢查有牙齒）
  - id: s_contract_price_hi
