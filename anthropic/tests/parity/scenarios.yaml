# Parity 情境檔（CLAUDE.md 第 3 節）。每個情境：改寫輸入 → LibreOffice 重算（基準）→ 與 engine 比對全部公式格。
# 輸入一律以具名範圍設定（SRC_ANT_nnn、INP_nnn、TK_*）。v0.1-A2：Demand、Revenue、Checks 由情境驅動；v0.1-A3 加 Compute、Cost。
# expect_err：該情境必須讓這些檢查轉 ERR（保證檢查有牙齒）；expect_warn：CHK_Warnings ≥ 1。
workbook_expectations:            # 版本升級時必須有意識地更新（CLAUDE.md 第 4 節）
  sheets: [README, SRC_ANT, TK_Link, OAI_Link, Inputs, Demand, Revenue, Compute, Cost, Checks, _Defaults]
  formula_cells: 4720             # A3：A2 的 2,942 − Inputs 退役 1 列 ×2 ＋ Inputs 新增 56 列 ×2 ＋ Compute、Cost ＋ Checks C49–C82
  defined_names: 1007              # A3：＋Inputs 55（淨）、TK_PUE 3、CMP_*／COST_* 等
  src_rows: 379                   # A1 376＋A2 新增 3（SRC_ANT_377–379）
  src_named: 330                  # 有值欄的列才有 SRC_ANT_nnn 名稱（另有 _Lo／_Hi／_Date）
  inp_rows: 160                   # INP_001–164；INP_016（A2 容量上限佔位）、INP_067–069 退役
  tk_values: 68                   # OpenAI v0.6 同一組 63 名＋A2 新增 5 名（IF_HdrTask、IF_TaskLen、IF_TaskTokFresh／Cached／Dec）
  tk_nonnv: 18                    # TK_NNV_*（TPU v7、Trainium3、MI455X × 6；讀表，非具名）
  oai_names: 21                   # OAI_ 17 個逐年名稱＋4 個中繼資料
  tk_pending: 0

scenarios:
  - id: base
    description: 基準（不改任何輸入）
    inputs: {}
  - id: a_elasticity_high
    description: API 任務數價格彈性 −0.7 → −1.05（區間下緣；2027 起 token 與營收改變）
    inputs: {"INP_096": -1.05}
  - id: b_partner_fee_high
    description: 雲端平台抽成率 0.16 → 0.30（Inputs 上緣，BofA 推得）；2026 起抽成與淨額改變，總額不變
    inputs: {"INP_100": 0.3}
  - id: c_channel_share_up
    description: 雲端通路占 API 營收 ＋15 個百分點（通路分成情境）
    inputs: {"INP_099": 0.15}
  - id: d_plan_mix_max
    description: 2026 起 Pro 占個人付費 0.70 → 0.55（方案組合：Max 占比上升；2026 API 倒推值隨之下降、2027 起訂閱上升）
    inputs: {"INP_023": 0.55}
  - id: e_task_growth_low
    description: 2027 API 任務數成長 0.45 → 0.225（任務成長情境）
    inputs: {"INP_092": 0.225}
  - id: f_price_decline_steep
    description: 2027 起牌價年變動 −15% → −35%（價格與彈性共同作用）
    inputs: {"INP_098": -0.35}
  - id: g_consumer_share_high
    description: 消費者訂閱占 2025 營收 15% → 20%（SRC Analogy 上緣）：個人訂閱 0.92 > 訂閱合計 0.789，席位轉負（倒推檢查應 ERR）
    inputs: {"SRC_ANT_063": 0.2}
    expect_err: [a2_backsolve]
  - id: h_api_mix_broken
    description: 2026 起 API Haiku 占比 0.15 → 0.6，使 Haiku＋Sonnet > 1（組合檢查應 ERR）
    inputs: {"INP_079": 0.6}
    expect_err: [a2_mix]
  - id: k_runrate_alt
    description: 2026-07 年化營收 65 → 79.5（YipitData 第三方估計）：2026 半校準基準與 API 倒推改變
    inputs: {"SRC_ANT_023": 79.5}
  - id: l_opus55_price
    description: Opus 5.5 輸入牌價 4 → 3：2026 頂層加權牌價與 2027 起價格路徑改變
    inputs: {"SRC_ANT_111": 3}
  - id: m_tk_nonnv_broken
    description: TPU v7 產出比基準 0.8 → 1.2（高於高值 1.1；NonNV 快照順序檢查應 ERR）
    inputs: {"TK_NNV_TPUv7_Out": 1.2}
    expect_err: [tk_nnv_order]
  - id: n_event_date_broken
    description: Opus 5.5 公告日改為早於 Opus 5（價格事件順序檢查應 ERR；2026 加權牌價改變）
    inputs: {"SRC_ANT_111_Date": 46100}
    expect_err: [a2_evorder]
  - id: o_rev2025_alt
    description: 2025 認列營收 4.6 → 4.59（另一來源）：其他營收殘差與 2025 總額改變，校準差仍為 0
    inputs: {"SRC_ANT_001": 4.59}
  - id: p_runrate_warn
    description: 2026-07 年化營收 65 → 30：半校準總額遠低於里程碑推估（> 25% → WARN，不 ERR）
    inputs: {"SRC_ANT_023": 30}
    expect_warn: true
  - id: q_code_tokens
    description: 程式代理每任務 token 倍數（相對 Tokenomics 長程任務）0.15 → 0.4（區間上緣；只改 token，不改營收）
    inputs: {"INP_106": 0.4}
  - id: r_tk_task_tokens
    description: Tokenomics 快照：各任務每次嘗試快取 token ×（Coding agent 1,263,600 → 2,000,000）；程式代理 token 與 API 以外的 token 改變
    inputs: {"TK_IF_TaskTokCached[5]": 2000000}
  # ── v0.1-A3：Compute、Cost（工作單 A3 第 4 步：合約價、η、產出比、人數成長、自有資本支出、PUE ＋ 檢查有牙齒）
  - id: s_contract_price_hi
    description: 每 GW 年合約價 12 → 20（Inputs 上緣）：金額型合約 GW 下降、GW 型合約（AMD、Lambda）付款上升、η 上升
    inputs: {"INP_114": 20}
  - id: t_eta_rise
    description: η 路徑開關 0 → 1（線性回升至 2030＝1）：2026 起有效推論 GW 下降、研發 GW 上升
    inputs: {"INP_117": 1}
  - id: u_nnv_out_low
    description: Tokenomics NonNV 產出比取低值（TPU v7 0.8 → 0.6、Trainium3 0.5 → 0.3）：TPU／Trainium 每 GW 產能與 VR 等值係數下降
    inputs: {"TK_NNV_TPUv7_Out": 0.6, "TK_NNV_Trn3_Out": 0.3}
  - id: v_headcount_high
    description: 2026 員工人數年增率 0.8 → 1.2（Inputs 上緣）：非算力成本與股權報酬上升
    inputs: {"INP_156": 1.2}
  - id: w_owned_capex_half
    description: 自建（Fluidstack）總額 $50B → $25B：自有資本支出與自建 GW 減半
    inputs: {"SRC_ANT_212": 25}
  - id: x_pue_facility
    description: 口徑未明的揭露 GW 全部視為設施口徑（0 → 1），PUE 1.2 → 1.3：雙揭露型與 GW 型合約的 IT GW 下降
    inputs: {"INP_124": 1, "TK_PUE": 1.3}
  - id: y_broadcom_5gw_ramp3
    description: Google／Broadcom 容量改採公司自述 5 GW（開關 0 → 1），爬坡年數 2 → 3
    inputs: {"INP_128": 1, "INP_122": 3}
  - id: z_training_low_cap
    description: 2025 訓練支出 4.1 → 1.0：推論支出換算 GW 上升、η 降至約 0.3（η WARN），2027 起有效推論超過可用 GW → 容量上限 < 1、營收截頂
    inputs: {"SRC_ANT_253": 1.0}
    expect_warn: true
  - id: za_legacy_mix_broken
    description: 既有雲端組合 Trainium2 0.4 → 0.8、Hopper 0.1 → 0.3（TPU v6e 餘額 < 0；組合檢查與 Inputs 區間應 ERR）
    inputs: {"INP_125": 0.8, "INP_126": 0.3}
    expect_err: [a3_lmix, inp_order]
  - id: zb_sbc_too_high
    description: 每人股權報酬 0.8 → 3（$M）：2025 股權報酬超過說明書非算力費用（非算力 ≤0 應 ERR；Inputs 區間 ERR）
    inputs: {"INP_162": 3}
    expect_err: [a3_ncx25, inp_order]
