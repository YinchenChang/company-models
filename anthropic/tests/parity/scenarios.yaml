  - id: gf_spend_report_low
    description: U4 每 $1 算力支出的營收 1.70 → 3.0（Q3 隱含算力支出降到約 5.6）：報導外推全年約 20.2，模型合約實付高出 > 25%（WARN 增加；不 ERR）
    inputs: {"SRC_ANT_387": 3.0}
    expect_warn: true
  # ── v0.1.2（工作單 20261021 TK18）：Tokenomics v18.0 快照
  - id: ha_tk_tokgw_hopper_old
    description: TK IF_TokGW_Sol 的 Hopper 基準格回到 v5.26 值（2.149e10；v10.2 的 SLO 改動使它升到 3.363e10）：η（2025 校準）、各族 VR 等值係數與 2026 起供給／差額隨之改變（相對世代產能比的敏感度）
    inputs: {"TK_IF_TokGW_Sol[2]": 21490429685.4234}
  - id: hb_tk_pq_override
    description: TK L1_RevGW_PQ_VR200 48.79 → 30（只對照列）：COST_TKPQ 與比值改變，命題輸出不變（對照列不回饋計算）
    inputs: {"TK_L1_RevGW_PQ_VR200": 30}
  # ── v0.1.3 A 段
  - id: ha_u2_method_old
    description: U2 新法開關 1 → 0（INP_187；Nscale、Lambda 回到 v0.1.1 的金額回推口徑：付款＝86 的 MW 比例時程、GW＝付款 ÷ 合約價）：供給 GW、合約實付、命題差額改變
