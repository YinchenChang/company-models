# HTML 一頁摘要第 ⑥ 節的敏感度情境（A5；沿用 v0.1 完成報告③「三個關鍵驅動」與「要成立必須…」的設定）。
# 只定義「改哪些輸入格」，不含任何數值參數：值一律取自 Excel（Inputs 的低／高欄；TK NonNV 比例取 TK_Link 的 Lo／Hi 具名格）。
# 覆寫寫法（鍵＝INP_nnn 或 TK_NNV_* 具名範圍）：
#   lo / hi        → Inputs：該列的「低」「高」欄；TK_NNV_*：同名加 Lo／Hi 的具名格
#   {mul: INP_xxx} → 該格基準值 × INP_xxx 的值（本版未使用）
# 計算一律由 Excel 執行：build_html.py 以 LibreOffice 重算；tests/test_html.py 以 engine（pycel）重算比對。
groups:
  api_task_lo: {label: "API 任務數成長 2027–30 取低欄", set: {INP_092: lo, INP_093: lo, INP_094: lo, INP_095: lo}}
  api_task_hi: {label: "API 任務數成長 2027–30 取高欄", set: {INP_092: hi, INP_093: hi, INP_094: hi, INP_095: hi}}
  tok_lo: {label: "API 每任務 token 成長 2026–30 取低欄", set: {INP_087: lo, INP_088: lo, INP_089: lo, INP_090: lo, INP_091: lo}}
  tok_hi: {label: "API 每任務 token 成長 2026–30 取高欄", set: {INP_087: hi, INP_088: hi, INP_089: hi, INP_090: hi, INP_091: hi}}
