  fee_hi: {label: "雲端平台抽成率取高欄", set: {INP_100: hi}}
  # v0.1.1：關閉單項更新，用於「更新前後」分解（INP_180＝U1 開關、INP_182＝U2 開關；0＝回到 v0.1 的算法）
  u1_off: {label: "U1 關閉（2026 營收回到 v0.1：上半年 Q1＋Q2 ＋ 下半年持平於 2026-07 年化）", set: {INP_180: 0}}
  u2_off: {label: "U2 關閉（Nscale、Lambda 回到各自公告值）", set: {INP_182: 0}}
