  ramp_hi: {label: "爬坡年數取高欄", set: {INP_122: hi}}
  amd_short: {label: "AMD 合約期間取低欄", set: {INP_138: lo}}
  nnv_lo: {label: "NonNV 產出比（TPU、Trainium、AMD）取 TK 低", set: {TK_NNV_TPUv7_Out: lo, TK_NNV_Trn3_Out: lo, TK_NNV_MI455X_Out: lo}}
