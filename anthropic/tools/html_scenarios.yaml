# 情境＝群組的組合（依序套用）
scenarios:
  base: []
  api_task_lo: [api_task_lo]
  api_task_hi: [api_task_hi]
  tok_lo: [tok_lo]
  tok_hi: [tok_hi]
  elast_strong: [elast_strong]
  elast_weak: [elast_weak]
  price_cut: [price_cut]
  price_lo: [price_lo]
  price_hi: [price_hi]
  ramp_lo: [ramp_lo]
  ramp_hi: [ramp_hi]
  amd_short: [amd_short]
  nnv_lo: [nnv_lo]
  nnv_hi: [nnv_hi]
  combo1: [api_task_lo, elast_weak]
  combo2: [api_task_lo, price_hi]
  combo3: [elast_weak, price_hi, ramp_lo]
  combo4: [api_task_lo, elast_weak, price_hi, ramp_lo]
  # v0.1 → v0.1.1 的分解（v0.1.2 起同時把 TK 快照回到 v5.26，使數字等於 v0.1／v0.1.1 當時的輸出）
  v010: [tk19_back, u1_off, u2_off, tk_prev_tokgw, tk_prev_hold, tk_prev_rest]
  only_u1: [tk19_back, u2_off, tk_prev_tokgw, tk_prev_hold, tk_prev_rest]
  only_u2: [tk19_back, u1_off, u2_method_old, tk_prev_tokgw, tk_prev_hold, tk_prev_rest]
  # v0.1.1 → v0.1.2 的分解（TK v5.26 → v18.0）
  v011: [tk19_back, u2_method_old, tk_prev_tokgw, tk_prev_hold, tk_prev_rest]
  # v0.1.3：v0.1.2 的輸出（TK v18.0 與 v19.0 值相同，故只需關閉 U2 新法）
  v012: [tk19_back, u2_method_old]
  only_tokgw: [tk19_back, u2_method_old, tk_prev_hold, tk_prev_rest]
  only_hold: [tk19_back, u2_method_old, tk_prev_tokgw, tk_prev_rest]
  # v0.1.4：v0.1.3 的輸出（TK v19.0）與逐群拆解
  v013: [tk19_back]
  v14_only_luna: [tk19_rest_back]
  v14_only_rest: [tk19_luna_back]
  combo5: [api_task_lo, elast_weak, price_hi, ramp_lo, tok_lo, hc_hi, fee_hi]
