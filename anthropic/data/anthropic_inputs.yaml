# Inputs 唯一來源（Anthropic v0.1）。一列一個（參數 × 索引）；INP_nnn 由 builder/id_registry.json 依 key 發出、固定不重用。
# 欄位：key、name（參數）、index（索引）、unit、value／lo／hi、tag（Assumed／Analogy／Decision）、basis（依據）、range_why（區間理由）、note（用途）。
# Analogy／Assumed 一律給區間；Decision 為定義常數或開關（低＝高＝值）。不以公司自己的目標或預測反推（共同規則第 4 節）。
