# 跨模型數字一致性檢查（API 版，2026-10-27 起；說明見 tools/consistency/README.md）
# 每月 3 日 09:23（台北）在預設分支執行，結果 commit 到固定分支 consistency-results（不寫 main）；push 到 claude/consistency 可測試。
name: consistency-check
on:
  schedule:
    - cron: "23 1 3 * *"
  push:
    branches: [claude/consistency]
    paths: ["tools/consistency/check.py", ".github/workflows/consistency-check.yml"]
permissions:
  contents: write
concurrency:
  group: consistency-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install openpyxl
      - name: Check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 tools/consistency/check.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/cc && cp -r tools/consistency/out /tmp/cc/
          if [ "${GITHUB_REF_NAME}" = "claude/consistency" ]; then
            git add tools/consistency/out && git commit -m "consistency: 檢查結果 $(date -u +%F)" && git push
          else
            git fetch origin consistency-results && git checkout -B consistency-results origin/consistency-results || git checkout --orphan consistency-results
            git rm -rq --cached . >/dev/null 2>&1 || true
            mkdir -p tools/consistency && rm -rf tools/consistency/out && cp -r /tmp/cc/out tools/consistency/
            git add tools/consistency/out && git commit -m "consistency: 檢查結果 $(date -u +%F)" && git push origin consistency-results
          fi
