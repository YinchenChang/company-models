# PR 自動獨立核對（API 版，2026-10-27 起）：
# - 觸發：PR 開啟、重開、草稿轉正；或 repo 擁有者在 PR 留言「/api-review」重跑
#   （留言觸發用預設分支上的本檔，須本檔已合併）。
# - 不執行：草稿 PR、fork 來源的 PR（讀不到 secret）、分支 claude/api-smoke-test。
# - 用 secrets.ANTHROPIC_API_KEY（Max 方案每月 API credit），結果留言在 PR。
# - 參考用，不阻擋合併（與 CLAUDE.md「CI 不阻擋」一致）；錯誤只留言，工作流程不失敗。
# - 費用控制：送文字 diff，xlsx 改送逐格差異（.github/scripts/xlsx_pr_diff.py，2026-10-28 起；其他二進位略過），總量上限 REVIEW_MAX_CHARS
#   （2026-10-28 由 120,000 調為 160,000、逾時 15→25 分，因加入 Excel 變動；推估每次多 0–40,000 字元，以 Opus 5.5 輸入 US$4／百萬 token、約 1–1.5 字元／token 計約 US$0.1–0.2）。
# - concurrency 放在 job 層：只有真正執行的核對才互相取消；一般留言（job 被 if 略過）不會取消進行中的核對。
name: api-pr-review
on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  review:
    concurrency:
      group: api-pr-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    if: >
      (github.event_name == 'pull_request' && !github.event.pull_request.draft &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref != 'claude/api-smoke-test') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/api-review') &&
       github.event.comment.author_association == 'OWNER')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - run: pip install -q openpyxl
      - name: Review PR with Claude API
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REVIEW_MODEL: claude-opus-5-5
          REVIEW_MAX_CHARS: "160000"
        run: python3 .github/scripts/api_pr_review.py
