# px 工作單個股模型建置（API 版，2026-11-21 起；Andy 11-21 授權用 API 額度執行）。
# 觸發：push 到 claude/px1120 且 tools/px_agent/request.json 有變動。
# request.json：{"folders": [...], "model": "...", "budget_usd": 每家上限, "base": "claude/px1120"}
# 每家一個 job，用 Claude Code（secrets.ANTHROPIC_API_KEY）依 tools/px_agent/prompt.md 建置，
# 結果推到 claude/px1120-b/<資料夾>（只含該公司資料夾與 tools/px_agent/out/<資料夾>.json）。不寫 main。
name: px-build-agent
on:
  push:
    branches: [claude/px1120]
    paths: ['tools/px_agent/request.json']
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      folders: ${{ steps.p.outputs.folders }}
      model: ${{ steps.p.outputs.model }}
      budget: ${{ steps.p.outputs.budget }}
    steps:
      - uses: actions/checkout@v5
      - id: p
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          r = json.load(open("tools/px_agent/request.json"))
          print("folders=" + json.dumps(r["folders"]))
          print("model=" + r["model"]); print("budget=" + str(r["budget_usd"]))
          PY
  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        folder: ${{ fromJson(needs.plan.outputs.folders) }}
    steps:
      - uses: actions/checkout@v5
      - name: 安裝建置工具
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends python3-openpyxl python3-numpy libreoffice-calc fonts-noto-cjk >/dev/null
          pip install -q openpyxl numpy || true
          npm install -g @anthropic-ai/claude-code >/dev/null 2>&1
      - name: 建置（Claude Code，API 額度）
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          F: ${{ matrix.folder }}
          MODEL: ${{ needs.plan.outputs.model }}
          BUDGET: ${{ needs.plan.outputs.budget }}
        run: |
          mkdir -p tools/px_agent/out
          sed "s/{FOLDER}/$F/g" tools/px_agent/prompt.md > /tmp/prompt.txt
          python3 -c "import json;print(json.load(open('tools/px_agent/request.json')).get('extra',''))" >> /tmp/prompt.txt
          set +e
          timeout 80m claude -p "$(cat /tmp/prompt.txt)" --model "$MODEL" --max-budget-usd "$BUDGET" \
            --dangerously-skip-permissions --output-format json > /tmp/result.json 2> /tmp/err.log
          echo "exit=$?"
          python3 - <<'PY'
          import json, os
          f = os.environ["F"]
          try: r = json.load(open("/tmp/result.json"))
          except Exception as e: r = {"error": repr(e), "stderr": open("/tmp/err.log").read()[-2000:]}
          keep = {k: r.get(k) for k in ("subtype", "is_error", "num_turns", "duration_ms", "total_cost_usd", "result", "error", "stderr")}
          json.dump(keep, open(f"tools/px_agent/out/{f}.json", "w"), ensure_ascii=False, indent=1)
          print(json.dumps({k: keep[k] for k in ("subtype", "num_turns", "total_cost_usd")}, ensure_ascii=False)); print(keep.get("result") or keep)
          PY
      - name: 推到結果分支
        if: always()
        env:
          F: ${{ matrix.folder }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b "claude/px1120-b/$F"
          git add -A "$F" "tools/px_agent/out/$F.json"
          git commit -q -m "px1120：$F 換 2026-11-20 收盤（API 建置代理）" || echo "no change"
          git push -f origin "claude/px1120-b/$F"
