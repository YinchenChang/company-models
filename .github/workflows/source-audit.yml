# 來源複核（API 版，2026-10-28 起；說明見 tools/source_audit/README.md）
# 手動執行（workflow_dispatch）；push 到 claude/source-audit 只試跑 10 組。
# 結果與進度（state.jsonl）commit 到固定分支 source-audit-results（不寫 main），重跑時接續、累計花費不超過 max_usd。
name: source-audit
on:
  workflow_dispatch:
    inputs:
      max_usd: {description: "累計花費上限（美元，含先前各次）", default: "40"}
      max_groups: {description: "本次最多幾組（0 = 不限）", default: "0"}
  push:
    branches: [claude/source-audit]
    paths: ["tools/source_audit/audit.py", ".github/workflows/source-audit.yml"]
permissions:
  contents: write
concurrency:
  group: source-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install openpyxl
      - name: Restore previous progress
        run: |
          git fetch -q origin source-audit-results && git show origin/source-audit-results:tools/source_audit/out/state.jsonl > /tmp/state.jsonl 2>/dev/null || true
          mkdir -p tools/source_audit/out && [ -s /tmp/state.jsonl ] && cp /tmp/state.jsonl tools/source_audit/out/ || true
      - name: Audit
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_USD: ${{ github.event.inputs.max_usd || '3' }}
          MAX_GROUPS: ${{ github.event.inputs.max_groups || '10' }}
        run: python3 tools/source_audit/audit.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -d tools/source_audit/out ] || exit 0
          mkdir -p /tmp/sa && cp -r tools/source_audit/out /tmp/sa/
          git fetch -q origin source-audit-results && git checkout -B source-audit-results origin/source-audit-results || git checkout --orphan source-audit-results
          git rm -rq --cached . >/dev/null 2>&1 || true
          mkdir -p tools/source_audit && rm -rf tools/source_audit/out && cp -r /tmp/sa/out tools/source_audit/
          git add tools/source_audit/out && git commit -m "source-audit: 結果 $(date -u +%F)" && git push origin source-audit-results
