name: ai-semis-build

# AI 半導體 Project（橋接表、網通、設備、三家記憶體、台積電、Advantest、Disco、NVIDIA）的重建檢查：
# 以 repo 內的建檔程式重新產生 xlsx → LibreOffice headless 重算 → (1) 錯誤格數必須為 0；
# (2) 與各資料夾 dist/ 的成品逐格比對（數值容差 1e-9）。任何差異都讓 CI 失敗，並輸出前 20 個差異。
# 比對工具：tools/xlsx_diff.py（本機也可執行）。
on:
  push:
    paths:
      - 'markets/**'
      - 'tools/memory_model/**'
      - 'tools/xlsx_diff.py'
      - 'tools/cycle_position.py'
      - 'tools/valuation_rule.py'
      - 'tools/company_html/**'
      - '**/html.json'
      - 'skhynix/**'
      - 'micron/**'
      - 'samsung/**'
      - 'tsmc/**'
      - 'advantest/**'
      - 'disco/**'
      - 'nvidia/**'
      - 'arista/**'
      - 'ibiden/**'
      - 'delta/**'
      - 'quanta/**'
      - 'innolight/**'
      - 'avgo/**'
      - 'foxconn/**'
      - 'avc/**'
      - 'amat/**'
      - 'emc/**'
      - 'asml/**'
      - 'accton/**'
      - 'lrcx/**'
      - 'klac/**'
      - 'hanmi/**'
      - 'amd/**'
      - 'mrvl/**'
      - 'eoptolink/**'
      - 'kyec/**'
      - 'cohr/**'
      - 'amkr/**'
      - 'crdo/**'
      - 'lite/**'
      - '.github/workflows/ai-semis-build.yml'
  pull_request:
    paths:
      - 'markets/**'
      - 'tools/memory_model/**'
      - 'tools/xlsx_diff.py'
      - 'tools/cycle_position.py'
      - 'tools/valuation_rule.py'
      - 'tools/company_html/**'
      - '**/html.json'
      - 'skhynix/**'
      - 'micron/**'
      - 'samsung/**'
      - 'tsmc/**'
      - 'advantest/**'
      - 'disco/**'
      - 'nvidia/**'
      - 'arista/**'
      - 'ibiden/**'
      - 'delta/**'
      - 'quanta/**'
      - 'innolight/**'
      - 'avgo/**'
      - 'foxconn/**'
      - 'avc/**'
      - 'amat/**'
      - 'emc/**'
      - 'asml/**'
      - 'accton/**'
      - 'lrcx/**'
      - 'klac/**'
      - 'hanmi/**'
      - 'amd/**'
      - 'mrvl/**'
      - 'eoptolink/**'
      - 'kyec/**'
      - 'cohr/**'
      - 'amkr/**'
      - 'crdo/**'
      - 'lite/**'
      - '.github/workflows/ai-semis-build.yml'

permissions:
  contents: read

jobs:
  rebuild-and-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'   # markets/memory/__pycache__ 已被追蹤，避免重建時改動工作樹
    steps:
      - uses: actions/checkout@v4

      - name: 安裝 python3、openpyxl、libreoffice-calc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 python3-openpyxl python3-numpy libreoffice-calc

      - name: 重建、重算、檢查錯誤格並與 dist 比對
        run: |
          set -u
          mkdir -p build/raw build/out
          # 名稱｜建檔指令（輸出檔路徑接在最後）｜成品所在資料夾
          targets=(
            "bridge|python3 markets/chip_bridge/build_bridge.py|markets/chip_bridge/dist"
            "network|python3 markets/network/build_network.py|markets/network/dist"
            "equipment|python3 markets/equipment/build_equipment.py|markets/equipment/dist"
            "skhynix|python3 tools/memory_model/build.py skhynix/company.py|skhynix/dist"
            "micron|python3 tools/memory_model/build.py micron/company.py|micron/dist"
            "samsung|python3 tools/memory_model/build.py samsung/company.py|samsung/dist"
            "tsmc|python3 tsmc/build_tsmc.py|tsmc/dist"
            "advantest|python3 advantest/build_advantest.py|advantest/dist"
            "disco|python3 disco/build_disco.py|disco/dist"
            "nvidia|python3 nvidia/build_nvidia.py|nvidia/dist"
            "arista|python3 arista/build_arista.py|arista/dist"
            "ibiden|python3 ibiden/build_ibiden.py|ibiden/dist"
            "delta|python3 delta/build_delta.py|delta/dist"
            "quanta|python3 quanta/build_quanta.py|quanta/dist"
            "innolight|python3 innolight/build_innolight.py|innolight/dist"
            "avgo|python3 avgo/build_avgo.py|avgo/dist"
            "lite|python3 lite/build_lite.py|lite/dist"
            "crdo|python3 crdo/build_crdo.py|crdo/dist"
            "amkr|python3 amkr/build_amkr.py|amkr/dist"
            "cohr|python3 cohr/build_cohr.py|cohr/dist"
            "kyec|python3 kyec/build_kyec.py|kyec/dist"
            "eoptolink|python3 eoptolink/build_eoptolink.py|eoptolink/dist"
            "mrvl|python3 mrvl/build_mrvl.py|mrvl/dist"
            "amd|python3 amd/build_amd.py|amd/dist"
            "hanmi|python3 hanmi/build_hanmi.py|hanmi/dist"
            "klac|python3 klac/build_klac.py|klac/dist"
            "lrcx|python3 lrcx/build_lrcx.py|lrcx/dist"
            "accton|python3 accton/build_accton.py|accton/dist"
            "asml|python3 asml/build_asml.py|asml/dist"
            "emc|python3 emc/build_emc.py|emc/dist"
            "amat|python3 amat/build_amat.py|amat/dist"
            "avc|python3 avc/build_avc.py|avc/dist"
            "foxconn|python3 foxconn/build_foxconn.py|foxconn/dist"
          )
          failed=0
          for t in "${targets[@]}"; do
            IFS='|' read -r name cmd dist <<< "$t"
            echo "::group::$name"
            # 建檔（openpyxl 寫公式，無快取值）
            if ! $cmd "build/raw/$name.xlsx" > /dev/null; then
              echo "::error::$name 建檔失敗"; failed=1; echo "::endgroup::"; continue
            fi
            # 重算：LibreOffice headless 載入時計算公式並存成含快取值的 xlsx
            if ! soffice --headless --calc --convert-to xlsx:"Calc MS Excel 2007 XML" \
                 --outdir build/out "build/raw/$name.xlsx" > /dev/null 2>&1; then
              echo "::error::$name 重算失敗"; failed=1; echo "::endgroup::"; continue
            fi
            # 成品：該資料夾 dist/ 內唯一的 xlsx
            mapfile -t refs < <(ls "$dist"/*.xlsx 2>/dev/null)
            if [ "${#refs[@]}" -ne 1 ]; then
              echo "::error::$dist 內應剛好一個 xlsx，實際 ${#refs[@]} 個"; failed=1; echo "::endgroup::"; continue
            fi
            # 錯誤格數 0 ＋ 逐格比對（容差 1e-9），輸出前 20 個差異
            if ! python3 tools/xlsx_diff.py "build/out/$name.xlsx" "${refs[0]}" --tol 1e-9 --limit 20; then
              echo "::error::$name 與 ${refs[0]} 有差異或錯誤格"; failed=1
            fi
            echo "::endgroup::"
          done
          if [ "$failed" -ne 0 ]; then
            echo "重建結果與 dist 成品不一致（任何數值差異都視為錯誤）" >&2
            exit 1
          fi
          echo "全部模型重建後錯誤格 0、與 dist 逐格相同"

      - name: HTML 展示層檢核（重現性、抽數、無手寫數字、自含）
        run: |
          # 以 dist 內已提交的 xlsx 產生 HTML，須與已提交的 HTML 逐位元組相同；並逐一回頭比對 xlsx 重算值
          dirs=$(ls */html.json | xargs -n1 dirname)
          python3 tools/company_html/check_company_html.py $dirs

      - name: 總覽重跑（讀各公司 xlsx 的規則值；data.json 與 datasets 須與已提交的相同）
        run: |
          python3 markets/overview/extract.py > /dev/null

      - name: 確認工作樹未被改動
        run: |
          git diff --exit-code --stat -- . ':!build'
