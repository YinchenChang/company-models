# MAG 財報萃取（API 版，2026-10-27 起；說明見 mag/extract/README.md）
# push 到 claude/mag-extract 且 requests/ 有新請求時執行；結果 commit 回同一分支（GITHUB_TOKEN 推送不會再觸發）。
name: mag-extract
on:
  push:
    branches: [claude/mag-extract]
    paths: ["mag/extract/requests/*.json", "mag/extract/docs/**", "mag/extract/extract_filings.py", ".github/workflows/mag-extract.yml"]
permissions:
  contents: write
concurrency:
  group: mag-extract
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install openpyxl && sudo apt-get install -y -qq poppler-utils >/dev/null
      - name: Probe sources（診斷）
        run: |
          mkdir -p mag/extract/out
          { echo "# 來源連線診斷 $(date -u +%FT%TZ)"; echo "出口 IP：$(curl -s https://api.ipify.org)";
            for ua in "YinchenChang YinchenChang@users.noreply.github.com" "company-models YinchenChang@users.noreply.github.com"; do
              for enc in "gzip, deflate" "identity"; do
                c=$(curl -s --compressed -o /tmp/b -w '%{http_code}' -A "$ua" -H "Accept-Encoding: $enc" -H "Host: data.sec.gov" https://data.sec.gov/submissions/CIK0000789019.json)
                echo "- SEC $c｜UA=$ua｜Accept-Encoding=$enc"; done; done; } > mag/extract/out/_sec_probe.md
      - name: Extract
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 mag/extract/extract_filings.py
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A mag/extract
          git diff --cached --quiet || git commit -m "mag-extract: 萃取結果 $(date -u +%F)" && git push
