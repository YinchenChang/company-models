# MAG 財報萃取（API 版，2026-10-27 起；說明見 mag/extract/README.md）
# push 到 claude/mag-extract 且 requests/ 有新請求時執行；結果 commit 回同一分支（GITHUB_TOKEN 推送不會再觸發）。
name: mag-extract
on:
  push:
    branches: [claude/mag-extract]
    paths: ["mag/extract/requests/*.json", "mag/extract/extract_filings.py", ".github/workflows/mag-extract.yml"]
permissions:
  contents: write
concurrency:
  group: mag-extract
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install openpyxl
      - name: Probe sources（診斷）
        run: |
          UA="company-models research tool YinchenChang@users.noreply.github.com"
          mkdir -p mag/extract/out
          { echo "# 來源連線診斷 $(date -u +%FT%TZ)"; echo "出口 IP：$(curl -s https://api.ipify.org)";
            c=$(curl -s -o /tmp/b -w '%{http_code}' -A "$UA" https://data.sec.gov/submissions/CIK0000789019.json)
            echo "- SEC $c｜$(sed -e 's/<[^>]*>/ /g' /tmp/b | tr -s ' \n' ' ' | head -c 700)"
            for u in https://www.microsoft.com/en-us/investor/earnings/fy-2026-q4/press-release-webcast https://abc.xyz/investor/ https://ir.aboutamazon.com/quarterly-results/default.aspx; do
              c=$(curl -sL -o /tmp/b -w '%{http_code}' -A "Mozilla/5.0" "$u"); echo "- $c $u｜$(grep -o -i -E 'href=\"[^\"]*(10-?q|10q|10-k)[^\"]*\"' /tmp/b | head -5 | tr '\n' ' ')"; done; } > mag/extract/out/_sec_probe.md
      - name: Extract
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 mag/extract/extract_filings.py
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A mag/extract
          git diff --cached --quiet || git commit -m "mag-extract: 萃取結果 $(date -u +%F)" && git push
