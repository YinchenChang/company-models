# MAG 財報萃取（API 版，2026-10-27 起；說明見 mag/extract/README.md）
# push 到 claude/mag-extract 且 requests/ 有新請求時執行；結果 commit 回同一分支（GITHUB_TOKEN 推送不會再觸發）。
name: mag-extract
on:
  push:
    branches: [claude/mag-extract]
    paths: ["mag/extract/requests/*.json", "mag/extract/extract_filings.py"]
permissions:
  contents: write
concurrency:
  group: mag-extract
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install openpyxl
      - name: Probe SEC（診斷：狀態碼與出口 IP）
        run: |
          UA="company-models research tool YinchenChang@users.noreply.github.com"
          mkdir -p mag/extract/out
          { echo "# SEC 連線診斷 $(date -u +%FT%TZ)"; echo "出口 IP：$(curl -s https://api.ipify.org)";
            for u in https://data.sec.gov/submissions/CIK0000789019.json https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany\&CIK=789019 https://efts.sec.gov/LATEST/search-index?q=%22Microsoft%22; do
              c=$(curl -s -o /tmp/b -w '%{http_code}' -A "$UA" -H "Accept-Encoding: identity" "$u"); echo "- $c $u｜$(head -c 200 /tmp/b | tr '\n' ' ')"; done; } > mag/extract/out/_sec_probe.md
      - name: Extract
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 mag/extract/extract_filings.py
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A mag/extract
          git diff --cached --quiet || git commit -m "mag-extract: 萃取結果 $(date -u +%F)" && git push
