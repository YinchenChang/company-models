<title>AI 投資地圖</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
/* Layout: research-portal masthead → sticky section tabs → one view at a time; data dense, hairline tables, figures in mono. */
:root{
  --paper:#F5F6F8; --surface:#FFFFFF; --sunken:#EEF1F5; --ink:#0F1B2D; --muted:#5A6577; --faint:#8A94A3;
  --rule:#D8DDE4; --rule-strong:#AEB7C3; --navy:#12284A; --navy-ink:#E9EEF6; --navy-muted:#9FB0C9;
  --brass:#8C6A2E; --pos:#1D7A52; --pos-bg:#E3F2EA; --watch:#9A6410; --watch-bg:#F7EDDB; --neg:#B0281F; --neg-bg:#F8E4E2;
  --none:#6B7480; --none-bg:#ECEEF1; --bar:#2F4C78; --bar-soft:#C9D4E4;
  --f-display:"Noto Serif TC","Songti TC",Georgia,serif;
  --f-body:"IBM Plex Sans","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono","SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0C1118; --surface:#121923; --sunken:#0F151E; --ink:#E4E9F0; --muted:#9BA6B6; --faint:#6F7A8A;
  --rule:#243041; --rule-strong:#3A4A60; --navy:#0A1626; --navy-ink:#E4EAF3; --navy-muted:#8296B3;
  --brass:#C9A35C; --pos:#55C08E; --pos-bg:#11291F; --watch:#E2A64A; --watch-bg:#2B2213; --neg:#F07A70; --neg-bg:#301717;
  --none:#9AA3AF; --none-bg:#1C2430; --bar:#7FA2D6; --bar-soft:#2A3A52; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0C1118; --surface:#121923; --sunken:#0F151E; --ink:#E4E9F0; --muted:#9BA6B6; --faint:#6F7A8A;
  --rule:#243041; --rule-strong:#3A4A60; --navy:#0A1626; --navy-ink:#E4EAF3; --navy-muted:#8296B3;
  --brass:#C9A35C; --pos:#55C08E; --pos-bg:#11291F; --watch:#E2A64A; --watch-bg:#2B2213; --neg:#F07A70; --neg-bg:#301717;
  --none:#9AA3AF; --none-bg:#1C2430; --bar:#7FA2D6; --bar-soft:#2A3A52; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num,td.n,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;font-weight:700}
a{color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

/* masthead */
.mast{background:var(--navy);color:var(--navy-ink)}
.mast .wrap{padding-block:28px 22px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--navy-muted);display:flex;gap:10px;align-items:center}
.eyebrow::before{content:"";width:18px;height:2px;background:var(--brass)}
.mast h1{font-size:34px;letter-spacing:.02em;margin-top:8px}
.mast p{margin:8px 0 0;color:var(--navy-muted);max-width:62ch}
.meta{display:grid;grid-template-columns:auto auto;gap:3px 14px;font-size:12px;color:var(--navy-muted);border-left:1px solid #ffffff2e;padding-left:18px}
.meta b{color:var(--navy-ink);font-weight:500;font-family:var(--f-mono)}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--rule);background:var(--surface)}
.kpi{padding:16px 18px;border-right:1px solid var(--rule);min-width:0}
.kpi:last-child{border-right:0}
.kpi .k{font-size:11px;letter-spacing:.08em;color:var(--muted)}
.kpi .v{font-family:var(--f-mono);font-size:26px;font-weight:500;margin-top:2px}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--rule-strong)}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto}
.tab{appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-weight:500;padding:13px 16px 11px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tab .ix{font-family:var(--f-mono);font-size:11px;color:var(--faint);margin-right:6px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brass)}
.tab:hover{color:var(--ink)}

main{padding-block:26px 56px}
.view{display:grid;gap:22px;grid-template-columns:minmax(0,1fr)}
.view>*{min-width:0}
.head{display:grid;gap:6px;max-width:80ch}
.head h2{font-size:22px}
.head p{margin:0;color:var(--muted)}
.label{font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:2px}
.panel>.ph{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:12px 16px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.panel>.ph h3{font-size:15px}
.panel>.pb{padding:16px}
.note{font-size:12px;color:var(--muted)}
.tagx{font-family:var(--f-mono);font-size:10.5px;color:var(--faint);white-space:nowrap}

/* flow ribbon */
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;background:var(--surface);border:1px solid var(--rule)}
.flow .st{padding:14px 16px;position:relative;border-right:1px solid var(--rule);min-width:0}
.flow .st:last-child{border-right:0}
.flow .st:not(:last-child)::after{content:"";position:absolute;right:-7px;top:50%;width:12px;height:12px;background:var(--surface);border-top:1px solid var(--rule-strong);border-right:1px solid var(--rule-strong);transform:translateY(-50%) rotate(45deg);z-index:1}
.flow .t{font-size:12px;color:var(--muted)}
.flow .v{font-family:var(--f-mono);font-size:22px;font-weight:500}
.flow .v small{font-size:12px;color:var(--muted);font-weight:400}
.flow .r{font-size:11.5px;color:var(--faint);font-family:var(--f-mono)}

/* map */
.layer{display:grid;grid-template-columns:220px minmax(0,1fr);border:1px solid var(--rule);background:var(--surface)}
.layer+.layer{border-top:0}
.rail{padding:16px;border-right:1px solid var(--rule);background:var(--sunken);display:grid;gap:6px;align-content:start}
.rail .code{font-family:var(--f-mono);font-size:11px;color:var(--brass);letter-spacing:.08em}
.rail h3{font-size:17px}
.rail .fig{font-family:var(--f-mono);font-size:18px}
.rail .fig small{font-size:11px;color:var(--muted)}
.rail .cap{font-size:12px;color:var(--muted)}
.segs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:0}
.seg{padding:14px 16px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);display:grid;gap:8px;align-content:start;min-width:0}
.seg h4{margin:0;font-size:14px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.seg .irr{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.seg .share{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.sbar{height:6px;background:var(--bar-soft);position:relative}
.sbar i{position:absolute;inset:0 auto 0 0;background:var(--bar)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 8px;border:1px solid var(--rule);background:var(--surface);color:var(--muted);border-radius:2px;text-decoration:none;max-width:100%}
.chip.r{color:var(--ink);border-color:var(--rule-strong);font-weight:500;cursor:pointer}
.chip.r:hover{border-color:var(--ink)}
.chip .d{width:7px;height:7px;border-radius:50%;flex:none;background:var(--none)}
.chip .t{font-family:var(--f-mono);font-size:10.5px;color:var(--faint)}
.d.機會{background:var(--pos)} .d.觀察{background:var(--watch)} .d.偏貴{background:var(--neg)} .d.未估值{background:var(--none)}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.facility{padding:14px 16px;color:var(--muted);font-size:13px}
.axisB{font-size:12px;color:var(--muted);padding:10px 16px;border-top:1px dashed var(--rule-strong)}

/* tables */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;letter-spacing:.06em;color:var(--muted);font-weight:500;text-align:left;padding:9px 10px;border-bottom:1px solid var(--rule-strong);white-space:nowrap;background:var(--surface);position:sticky;top:0}
td{padding:9px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap}
tr:hover td{background:var(--sunken)}
.co b{font-weight:600}
.co .t{font-family:var(--f-mono);font-size:11px;color:var(--faint);margin-left:6px}
.co .s{display:block;font-size:11.5px;color:var(--muted)}
.score{display:grid;grid-template-columns:44px minmax(80px,1fr);gap:8px;align-items:center}
.score .b{height:8px;background:var(--bar-soft);position:relative}
.score .b i{position:absolute;inset:0 auto 0 0;background:var(--bar)}
.mini{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:2px;white-space:nowrap}
.pill.機會{color:var(--pos);background:var(--pos-bg)} .pill.觀察{color:var(--watch);background:var(--watch-bg)}
.pill.偏貴{color:var(--neg);background:var(--neg-bg)} .pill.未估值{color:var(--none);background:var(--none-bg)}
.up{color:var(--pos)} .dn{color:var(--neg)}
.flag{font-size:11px;color:var(--watch);display:block}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.fbtn{appearance:none;font:inherit;font-size:12px;padding:4px 10px;border:1px solid var(--rule-strong);background:var(--surface);color:var(--muted);border-radius:2px;cursor:pointer}
.fbtn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* range bars */
.rng{position:relative;height:18px;min-width:180px}
.rng .ax{position:absolute;top:50%;left:0;right:0;height:1px;background:var(--rule)}
.rng .z{position:absolute;top:0;bottom:0;width:1px;background:var(--ink);opacity:.55}
.rng .rs{position:absolute;top:6px;height:6px;background:var(--bar-soft)}
.rng .c{position:absolute;top:3px;width:12px;height:12px;border-radius:50%;transform:translateX(-50%);border:2px solid var(--surface)}
.rng .c.機會{background:var(--pos)} .rng .c.觀察{background:var(--watch)} .rng .c.偏貴{background:var(--neg)}
.rng .o{position:absolute;top:1px;font-size:10px;font-family:var(--f-mono);color:var(--muted)}
details summary{cursor:pointer;color:var(--muted);font-size:12px;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"＋ ";font-family:var(--f-mono)}
details[open] summary::before{content:"－ "}
.det{display:grid;gap:4px;font-size:12px;color:var(--muted);margin-top:6px;max-width:72ch}
.det b{color:var(--ink);font-weight:500}

/* scatter */
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-body);fill:var(--muted);font-size:11px}
.chart .lab{fill:var(--ink);font-size:11px}
.chart .gl{stroke:var(--rule);stroke-width:1}
.chart .zl{stroke:var(--ink);stroke-opacity:.5;stroke-width:1}
.chart .q{fill:var(--brass);font-size:11px;letter-spacing:.06em}

.callouts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.callout{background:var(--surface);border:1px solid var(--rule);padding:12px 14px;display:grid;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
.callout b{color:var(--ink);font-size:13px}
.def{display:grid;grid-template-columns:200px minmax(0,1fr);gap:0;border-top:1px solid var(--rule)}
.def dt,.def dd{padding:10px 12px;border-bottom:1px solid var(--rule);margin:0}
.def dt{font-weight:600;background:var(--sunken)}
.def dd{color:var(--muted);min-width:0}
.def dd code{font-family:var(--f-mono);font-size:12px;color:var(--ink)}
/* profile index */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:0;border:1px solid var(--rule);background:var(--surface)}
.pcard{appearance:none;text-align:left;font:inherit;color:inherit;background:none;border:0;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:14px 16px;display:grid;gap:6px;cursor:pointer;min-width:0}
.pcard:hover{background:var(--sunken)}
.pcard .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pcard b{font-size:14px}
.pcard .t{font-family:var(--f-mono);font-size:11px;color:var(--faint)}
.pcard p{margin:0;font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.grp{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--brass);margin:6px 0 -12px}
.linkish{appearance:none;background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left}
.linkish:hover b,.linkish:hover{text-decoration:underline;text-underline-offset:3px}

/* drawer */
.scrim{position:fixed;inset:0;background:#0b1220;opacity:.38;z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--surface);z-index:21;display:grid;grid-template-rows:auto auto minmax(0,1fr);box-shadow:-12px 0 32px #0000002e;border-left:1px solid var(--rule-strong);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dh{background:var(--navy);color:var(--navy-ink);padding:16px 22px 12px;display:grid;gap:6px}
.dh .row1{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dh h2{font-size:24px}
.dh .sub{font-size:12px;color:var(--navy-muted);font-family:var(--f-mono)}
.dh .one{font-size:13.5px;color:var(--navy-ink);max-width:62ch}
.dh .close{appearance:none;border:1px solid #ffffff40;background:none;color:var(--navy-ink);font:inherit;font-size:12px;padding:4px 10px;cursor:pointer;border-radius:2px;white-space:nowrap}
.dstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--rule)}
.dstats div{padding:10px 14px;border-right:1px solid var(--rule);min-width:0}
.dstats div:last-child{border-right:0}
.dstats .k{font-size:11px;color:var(--muted)}
.dstats .v{font-family:var(--f-mono);font-size:15px}
.dbody{overflow-y:auto;min-height:0;display:block}
.dtabs{display:flex;gap:2px;border-bottom:1px solid var(--rule-strong);padding:0 14px;overflow-x:auto;position:sticky;top:0;background:var(--surface);z-index:1}
.dtab{appearance:none;border:0;background:none;font:inherit;font-size:13px;color:var(--muted);padding:11px 10px 9px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.dtab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brass)}
.dpane{padding:18px 22px 40px;display:grid;gap:18px;align-content:start}
.dsec{display:grid;gap:8px}
.dsec h3{font-family:var(--f-body);font-size:12px;letter-spacing:.1em;color:var(--brass);font-weight:600}
.dsec ul,.dsec ol{margin:0;padding-left:1.2em;display:grid;gap:5px;max-width:70ch}
.dsec p{margin:0;max-width:70ch}
.dsec li{padding-left:2px}
.ptbl{overflow-x:auto;border:1px solid var(--rule)}
.ptbl table{font-size:12.5px}
.ptbl th{position:static;background:var(--sunken)}
.ptbl td{vertical-align:top}
.mixbar{display:block;height:5px;background:var(--bar-soft);margin-top:4px;min-width:60px}
.mixbar i{display:block;height:100%;background:var(--bar)}
.tg{font-family:var(--f-mono);font-size:10px;color:var(--faint);overflow-wrap:anywhere}
.dmeta{display:flex;flex-wrap:wrap;gap:2px 18px;font-size:12px;color:var(--muted)}
.dmeta .mi{display:inline-flex;gap:6px}
.dmeta b{color:var(--ink);font-weight:500}
.ev li{list-style:none;margin-left:-1.2em;padding-left:0;border-left:2px solid var(--rule-strong);padding:2px 0 2px 12px}
.pending{padding:22px;color:var(--muted)}
@media (max-width:600px){.dstats{grid-template-columns:repeat(2,minmax(0,1fr))}.dstats div:nth-child(2){border-right:0}.dh h2{font-size:20px}}

footer{border-top:1px solid var(--rule);padding-block:18px 28px;color:var(--faint);font-size:12px}

@media (max-width:900px){
  .mast .wrap{grid-template-columns:1fr}
  .meta{border-left:0;padding-left:0}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi:nth-child(2){border-right:0} .kpi:nth-child(-n+2){border-bottom:1px solid var(--rule)}
  .flow{grid-template-columns:repeat(2,minmax(0,1fr))}
  .flow .st:nth-child(2){border-right:0}.flow .st:nth-child(-n+2){border-bottom:1px solid var(--rule)}
  .flow .st::after{display:none}
  .layer{grid-template-columns:1fr}
  .rail{border-right:0;border-bottom:1px solid var(--rule)}
  .callouts{grid-template-columns:1fr}
  .def{grid-template-columns:1fr}
}
@media (max-width:480px){.mast h1{font-size:28px}.kpi .v{font-size:22px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="mast">
  <div class="wrap">
    <div>
      <div class="eyebrow">算力收支 · AI 半導體 研究整合</div>
      <h1>AI 投資地圖</h1>
      <p>以 Tokenomics 的每 GW 算力經濟為骨架，把各專案的個股研究放回 AI 供應鏈：錢從哪裡來、流到哪一層、哪家公司守得住位置、現價是否已經反映。</p>
    </div>
    <div class="meta" id="meta"></div>
  </div>
</header>
<section class="kpis" id="kpis" aria-label="摘要"></section>
<nav class="tabs" aria-label="視角">
  <div class="wrap" role="tablist">
    <button class="tab" role="tab" id="t-map" data-v="map" aria-selected="true"><span class="ix">01</span>供應鏈地圖</button>
    <button class="tab" role="tab" id="t-position" data-v="position" aria-selected="false"><span class="ix">02</span>產業地位</button>
    <button class="tab" role="tab" id="t-invest" data-v="invest" aria-selected="false"><span class="ix">03</span>可投資性</button>
    <button class="tab" role="tab" id="t-profiles" data-v="profiles" aria-selected="false"><span class="ix">04</span>公司檔案</button>
    <button class="tab" role="tab" id="t-method" data-v="method" aria-selected="false"><span class="ix">附</span>方法與來源</button>
  </div>
</nav>

<main class="wrap">
  <section class="view" id="v-map"></section>
  <section class="view" id="v-position" hidden></section>
  <section class="view" id="v-invest" hidden></section>
  <section class="view" id="v-profiles" hidden></section>
  <section class="view" id="v-method" hidden></section>
</main>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-modal="true" role="dialog" aria-labelledby="dname"></aside>

idigm（2021 年收購 Intel NAND 事業）負責 [外部新聞：Seoul Economic Daily]。</li></ul>", "主要產品與營收占比": "<div class=\"ptbl\"><table><thead><tr><th>產品／部門</th><th>內容（白話）</th><th>營收占比</th><th>期間</th><th>標記</th></tr></thead><tbody><tr><td>DRAM（含 HBM）</td><td>伺服器、手機、PC 工作記憶體與 HBM</td><td>74.7%</td><td>2026 上半年（實績）</td><td><span class=\"tg\">[本專案：20261023_SK海力士模型_v0.4.1.xlsx Q!F5:G5 ÷ Q!F4:G4，Derived]</span></td></tr><tr><td>NAND</td><td>SSD、手機儲存</td><td>25.0%</td><td>2026 上半年（實績）</td><td><span class=\"tg\">[本專案：同檔 Q!F6:G6]</span></td></tr><tr><td>其他</td><td>—</td><td>0.3%</td><td>2026 上半年（實績）</td><td><span class=\"tg\">[本專案：同檔 Q!F7:G7]</span></td></tr><tr><td>一般 DRAM（模型拆分）</td><td>不含 HBM 的 DRAM</td><td>62.0%</td><td>2026E（模型）</td><td><span class=\"tg\">[本專案：同檔 Y!C5 ÷ Y!C4，Derived]</span></td></tr><tr><td>HBM（模型拆分）</td><td>AI 加速器用堆疊記憶體</td><td>11.9%</td><td>2026E（模型）</td><td><span class=\"tg\">[本專案：同檔 Y!C9]</span></td></tr><tr><td>NAND（模型）</td><td>同上</td><td>25.7%</td><td>2026E（模型）</td><td><span class=\"tg\">[本專案：同檔 Y!C7 ÷ Y!C4，Derived]</span></td></tr></tbody></table></div><ul><li>公司只揭露 DRAM／NAND，不拆 HBM；上表 HBM 11.9% 是模型推估（HBM 市場 × 市占），CLSA 估 HBM 占 DRAM 營收 19% <span class=\"tg\">[本專案：先驗比對_SK海力士_20261008.md S3]</span>。前三列合計 100%，後三列合計 99.6%（其他 0.3% 未列）。</li><li>記憶體營業利益率：2025 年 48.6%，2026Q1 71.5%、Q2 76.3% <span class=\"tg\">[本專案：同檔 Y!B15、Q!F11、Q!G11]</span>。</li><li>HBM 毛利率無法由公開資料分離 <span class=\"tg\">[本專案：skhynix/README.md 已知簡化 3]</span>。</li></ul>", "市場定位與產業位置": "<ul><li>HBM 營收市占：本專案 2026 全年 52–55% <span class=\"tg\">[本專案：先驗比對_HBM_20261008.md H3]</span>；模型基準 52%（區間 48–56%），依據 Counterpoint 2026Q1 58%、Q2 50%，IDC Q1 56.4% <span class=\"tg\">[本專案：同檔 In!E27、H27]</span>。2027 年模型降到 42%（UBS 位元口徑 SK 39%、三星 41%、美光 20%）<span class=\"tg\">[本專案：同檔 In!E28]</span>。</li><li>HBM 市場規模（模型）：2026 年 US$55.2B、2027 年 US$154.1B；2027 年需求比供給多約 1.2 EB，屬供給瓶頸 <span class=\"tg\">[本專案：同檔 Mkt!D33、E33、E27]</span>。</li><li>瓶頸角色：HBM 只有三家供應，2026–27 為供給瓶頸 <span class=\"tg\">[本專案：segments_ai_semis_v0.2.2.csv 記憶體列]</span>。</li><li>定價：HBM 2027 年單價變動假設 +80%（BofA +38% 到 TrendForce +121%），屬年約、已大致議定 <span class=\"tg\">[本專案：同檔 In!E30、H30]</span>。</li></ul>", "管理層與經營風格": "<div class=\"ptbl\"><table><thead><tr><th>職位</th><th>姓名</th><th>任職起</th><th>背景</th></tr></thead><tbody><tr><td>執行長</td><td>郭魯正（Kwak Noh-jung）</td><td>2022-03</td><td>曾任 Solidigm 代理執行長 [外部・未經本專案檢核]</td></tr><tr><td>董事會議長</td><td>高承範（Koh Seung-beom，獨立董事）</td><td>未查證</td><td>[外部・未經本專案檢核]</td></tr><tr><td>SK 集團會長（實質控制人）</td><td>崔泰源（Chey Tae-won）</td><td>未查證</td><td>經 SK Inc. → SK Square 持有 SK 海力士；持股比例本專案未建立 [外部・未經本專案檢核]</td></tr></tbody></table></div><ul><li>經營風格：本專案尚未研究。</li><li>本專案模型可見的資本配置事實：2025–27 年股東回饋為累計自由現金流的 50% 以上；2026-08 公告 40 兆韓元買回並註銷；2026 資本支出約 48.7 兆韓元 <span class=\"tg\">[本專案：同檔 In!H71、E65、E42]</span>。</li><li>2026-09 SK 集團把三位副會長調到 SK 海力士，負責中長期策略 [外部新聞：Korea JoongAng Daily]。</li></ul>", "同業與競爭態勢": "<div class=\"ptbl\"><table><thead><tr><th>同業</th><th>重疊領域</th><th>市占或規模</th><th>標記</th></tr></thead><tbody><tr><td>三星電子</td><td>HBM、DRAM、NAND</td><td>HBM 2026 營收市占 28–32%（本專案）；Counterpoint 2Q26 33%</td><td><span class=\"tg\">[本專案：先驗比對_HBM_20261008.md H3]</span></td></tr><tr><td>美光</td><td>HBM、DRAM、NAND</td><td>HBM 2026 營收市占 18–20%（本專案）</td><td><span class=\"tg\">[本專案：先驗比對_HBM_20261008.md H3]</span></td></tr><tr><td>中國 DRAM 廠（長鑫等）</td><td>一般 DRAM</td><td>本專案未建立</td><td>—</td></tr></tbody></table></div><ul><li>三星 2026 下半年 HBM4 放量，本專案模型假設 SK 海力士 HBM 市占由 2026 年 52% 降到 2027 年 42% <span class=\"tg\">[本專案：20261023_SK海力士模型_v0.4.1.xlsx In!E27:E28]</span>。</li><li>堆疊製程：SK 海力士 HBM4 用 MR-MUF，三星與美光用 TC-NCF；混合鍵合業界預期 HBM5（2029–2030）才成主流 <span class=\"tg\">[本專案：先驗比對_HBM_20261008.md H4–H5]</span>。</li></ul>", "近期重大事件": "<ul><li>2026-10-23｜宣布暫停 Solidigm 上市與上市前募資審查；股價收 127.7 萬韓元｜股東擔心稀釋，Solidigm 擴產資金來源仍未定 [外部新聞：Seoul Economic Daily]</li><li>2026-10-21｜40 兆韓元買回（8-20 起）執行完畢｜市場期待 10-28 法說公布新一輪回饋 [外部新聞：Seoul Economic Daily]</li><li>2026-10-21｜報導指三星、SK 海力士升級中國廠製程｜美方 2026 年改為逐年核發設備許可，升級類設備最受限 [外部新聞：CNBC 轉 Reuters（僅標題）；tech-insider]</li><li>2026-09-18 、E96、E97]</span>。</li></ul>", "同業與競爭態勢": "<div class=\"ptbl\"><table><thead><tr><th>同業</th><th>重疊領域</th><th>市占或規模</th><th>標記</th></tr></thead><tbody><tr><td>欣興</td><td>AI 加速器 ABF 載板</td><td>NVIDIA 約 30% 顆數（2025，第三方研究）；2026 資本支出 NT$340 億</td><td><span class=\"tg\">[本專案：20261024_Ibiden模型_v0.1.xlsx In!H51、H52]</span></td></tr><tr><td>三星電機</td><td>ABF 載板</td><td>本專案未建立（獲 NVIDIA 擴產合作）</td><td><span class=\"tg\">[本專案：同檔 In!I51]</span></td></tr><tr><td>景碩</td><td>ABF 載板</td><td>3 年資本支出 NT$235 億</td><td><span class=\"tg\">[本專案：同檔 In!H52]</span></td></tr><tr><td>Shinko、AT&amp;S</td><td>ABF 載板</td><td>本專案未建立</td><td><span class=\"tg\">[本專案：先驗比對_Ibiden_20261024.md I6b]</span></td></tr></tbody></table></div><ul><li>競爭者與 Ibiden 同時擴產；模型假設 Ibiden 份額相對值 2027／2028／2029 ＝ 0.95／0.88／0.85 <span class=\"tg\">[本專案：同檔 In!E51:E53]</span>。</li><li>ABF 供需：未具名供應鏈分析稱缺口 2027 約 21%、2028 超過 40%，BofA 稱短缺延續到 2028 <span class=\"tg\">[本專案：先驗比對_Ibiden_20261024.md I9]</span>。</li></ul>", "近期重大事件": "<ul><li>2026-10-01｜一拆二生效（年內第二次）｜EPS 口徑改變，FY2026 預測 EPS 為 ¥149.68（分割後）<span class=\"tg\">[本專案：同檔 In!E78]</span>；[外部新聞：Tokyo Brief]</li><li>2026-08-04｜第一季決算並上修全年預測：營收 ¥5,000 億 → 5,500 億、營業利益 ¥900 億 → 1,270 億、淨利 ¥580 億 → 840 億｜模型 FY2026 錨點 <span class=\"tg\">[本專案：同檔 In!E69、E76、E77]</span>；[外部新聞：Tokyo Brief]</li><li>2026 年第三季起｜味之素 ABF 膜漲價約 30%｜成本端壓力 <span class=\"tg\">[本專案：先驗比對_Ibiden_20261024.md I11]</span></li></ul>", "需要觀察的事項": "<ul><li>第二季決算與全年預測｜模型錨點為 8 月上修後預測，Q2 後更新 <span class=\"tg\">[本專案：ibiden/README.md]</span>｜預計 10 月底或 11 月初（去年為 2025-10-31；本次日期未確認）</li><li>短缺溢價回落｜模型溢價指數 FY2028 0.95、FY2029 0.90；溢價回落是電子事業營益率由 31.3%（FY2027）降到 26.7%（FY2029）的主因 <span class=\"tg\">[本專案：同檔 In!E56:E57、PL!E9、G9]</span>｜競爭者產能開出、ABF 價格</li><li>份額流失｜欣興、三星電機擴產；模型 FY2028 份額相對值 0.88 <span class=\"tg\">[本專案：同檔 In!E52]</span>｜NVIDIA 新平台供應鏈消息</li><li>估值依賴溢價延續｜現價對 FY2026 EPS 65.2x、FY2027 45.2x、FY2028 A／B／C 44.6／52.9／65.1x；十年 P/E 規則值待 Bloomberg 未建 <span class=\"tg\">[本專案：同檔 Val!B7:D9；ibiden/README.md]</span>｜補十年 P/E 後</li><li>加速器顆數情境｜FY2 ead><tbody><tr><td>精密加工裝置</td><td>切割機 31%、研削機 28%、附屬裝置 3%</td><td>62%</td><td>FY2025（2025-04～2026-03）</td><td><span class=\"tg\">[本專案：Disco模型_v0.1.3.xlsx Q!D15:D17、In!H11]</span></td></tr><tr><td>精密加工ツール</td><td>刀片、砂輪等耗材</td><td>21%</td><td>FY2025</td><td><span class=\"tg\">[本專案：Disco模型_v0.1.3.xlsx Q!D18]</span></td></tr><tr><td>その他</td><td>零件、服務、二手機等</td><td>16%</td><td>FY2025</td><td><span class=\"tg\">[本專案：Disco模型_v0.1.3.xlsx Q!D19]</span></td></tr><tr><td>合計</td><td>公司構成比取整數，合計 99%</td><td>99%</td><td>FY2025</td><td><span class=\"tg\">[本專案：Disco模型_v0.1.3.xlsx In!H11]</span></td></tr></tbody></table></div><ul><li>最近一季（FY2026 第二季）構成比：裝置 63%、耗材 23%、其他 14% <span class=\"tg\">[本專案：Disco模型_v0.1.3.xlsx Q!E15:E19]</span>。</li><li>AI 占比，兩種口徑並列：生成 AI 出貨 ¥75B ÷ 營收約 17% <span class=\"tg\">[本專案：先驗比對_日本候選與Disco_20261023.md 第 1 節，來源樂天證券今中能夫，Interested-party]</span>；本專案模型把其他營收按比例分攤後 AI 裝置占 20.7%，含 AI 耗材則 27.7% <span class=\"tg\">[本專案：disco/README.md 結果]</span>。</li><li>用途別：記憶體占營收 FY2026 第一季 35%、第二季略低於 40%、第三季預估約 30%；功率半導體不到一成 <span class=\"tg\">[本專案：Disco模型_v0.1.3.xlsx Q!A21，公司法說經 BigGo 摘要]</span>。</li><li>毛利率 FY2025 約 70.1%、FY2026 第二季 71.7%；營業利益率 FY2025 42.3% <span class=\"tg\">[本專案：Disco模型_v0.1.3.xlsx Q!F10、H10、F9]</span>。</li></ul>", "市場定位與產業位置": "<ul><li>研削與切割市占 60–80%：Morningstar 60–70%、現代ビジネス 7–8 成，兩者都沒有引用一手調查 <span class=\"tg\">[本專案：Disco模型_v0.1.3.xlsx In!E81、H81、I81，Interested-party]</span>。</li><li>定價權：本專案判斷 Disco 是日本設備材料候選中定價權最強者（市占、營益率、毛利率三者都高）<span class=\"tg\">[本專案：先驗比對_日本候選與Disco_20261023.md J2]</span>。</li><li>客戶集中：HBM 由三家記憶體廠生產，客戶集中是風險 <span class=\"tg\">[本專案：先驗比對_日本候選與Disco_20261023.md D6]</span>；客戶占比數字本專案未建立。</li><li>公司只給下一季指引，不給全年 <span class=\"tg\">[本專案：disco/README.md 資料狀態]</span>。</li></ul>", "管理層與經營風格": "<div class=\"ptbl\"><table><thead><tr><th>職位</th><th>姓名</th><th>任職起</th><th>背景</th></tr></thead><tbody><tr><td>代表執行役社長（CEO）兼董事會議長</td><td>關家一馬（Kazuma Sekiya）</td><td>2009-04 任社長</td><td>創辦家族；1995 年起任董事；2026-04 起兼長野事業所長 [外部・未經本專案檢核]</td></tr><tr><td>代表執行役副社長</td><td>吉永晃（Akira Yoshinaga）</td><td>2023-06</td><td>內部晉升 [外部・未經本專案檢核]</td></tr><tr><td>執行役常務</td><td>田村隆夫（Takao Tamura）</td><td>2022-06</td><td>1995 年起任董事 [外部・未經本專案檢核]</td></tr></tbody></table></div><ul><li>公司採指名委員會等設置公司制度（2022-06 起），董事 10 人中 7 人為獨立外部董事；2026-06 股東會後新增外部董事佐野秀司 [外部・未經本專案檢核]。</li><li>只揭露下一季指引（理由是客戶投資意願變化快）<span class=\"tg\">[本專案：disco/README.md 資料狀態]</span>。</li><li>資本配置（配息、買回）：本專案尚未研究。</li></ul>", "同業與競爭態勢": "<div class=\"ptbl\"><table><thead><tr><th>同業</th><th>重疊領域</th><th>市占或規模</th><th>標記</th></tr></thead><tbody><tr><td>東京精密（7729）</td><td>切割、研削、探針台</td><td>市占本專案未建立；HBM 約占其 SPE 營收 15%</td><td><span class=\"tg\">[本專案：先驗比對_日本候選與Disco_20261023.md 第 1 節，Derived]</span></td></tr><tr><td>SPTS 等電漿切割</td><td>可能取代部分刀片切割</td><td>本專案未建立</td><td><span class=\"tg\">[本專案：disco/README.md 主要判斷 1]</span></td></tr><tr><td>中國本土設備廠</td><td>研削、切割</td><td>本專案未建立</td><td><span class=\"tg\">[本專案：Disco模型_v0.1.3.xlsx In!H82]</span></td></tr></tbody></table></div><ul><li>混合鍵合（不用凸塊、直接把晶粒銅面接合）是 HBM 的下一步技術：一方面要更高精度的研削（對 Disco 有利），一方面要求切割不產生微粒、可能改用電漿切割（不利）。本專案判斷淨效果 +10%，對 EPS 影響很小 <span class=\"tg\">[本專案：disco/README.md 主要判斷 1]</span>。</li><li>本專案敏感度：市占在 FY2029 下滑 10 個百分點時，FY2028 EPS −7.0% <span class=\"tg\">[本專案：disco/README.md 敏感度]</span>。</li></ul>", "近期重大事件": "<ul><li>2026-10-22｜FY2026 上半營收 ¥257.1B（+32.1%）、營業利益 ¥116.6B；第三季指引營收 ¥132.4B、營業利益 ¥58.1B、匯率假設 ¥151 <span class=\"tg\">[本專案：Disco模型_v0.1.3.xlsx In!E100:E101、E108:E109]</span></li><li>2026-10-22｜法說：第三季出貨只比第二季多約 1%，HBM 暫歇，記憶體占比由近 40% 降至約 30%；第三季毛利率比第二季低不到 2 個百分點 <span class=\"tg\">[本專案：disco/README.md v0.1.1 說明、In!H112，經 BigGo 摘要]</span></li><li>2026-10-22｜同日日本半導體類股普遍下跌 6–11% <span class=\"tg\">[本專案：先驗比對_日本候選與Disco_20261023.md 注意]</span>；中間配息預估上調至 ¥186 [外部新聞：Invest Leaders]</li><li>2026-07-31｜第一季（7-23 公布）營收 ¥114.3B、營業利益 ¥49.0B，但首次揭露的第二季淨利指引低於 QUICK 共識，股價次日收跌 12.3% [外部新聞：マネーポスト]</li><li>2026-06-25｜公司治理報告更新，董事會 10 人 [外部・未經本專案檢核]</li></ul>", "需要觀察的事項": "<ul><li>第四季（2027-01～03）營收對第三季的增幅｜本專案基準 +10%（區間 0–22%），決定 FY2026 錨點 <span class=\"tg\">[本專案：Disco模型_v0.1.3.xlsx In!E114]</span>｜約 2027-01 第三季財報</li><li>HBM 出貨位元與堆疊層數｜AI 裝置需求的主驅動；情境 C 的 FY2028 EPS 比 A 低 28.3% <span class=\"tg\">[本專案：disco/README.md 敏感度]</span>｜記憶體三家財報</li><li>非 AI 裝置成長（功率、中國 OSAT）｜年增 0%／12% 使 FY2028 EPS −8.0%／+8.9%，是最敏感項之一 <span class=\"tg\">[本專案：disco/README.md 敏感度]</span>｜每季用途別揭露</li><li>AI 耗材比例｜10%／40% 使 FY2028 EPS −6.0%／+4.4% <span class=\"tg\">[本專案：disco/README.md 敏感度]</span>｜公司對消耗品的說明</li><li>估值｜A 情境 FY2027 中段 28.1x 隱含 ¥48,426，相對 ¥51,230 −5%；C 情境見頂 19.6x 隱含 −46% <span class=\"tg\">[本專案：disco/README.md 估值]</span>｜設備市場見頂年度</li></ul>", "來源": "<ol><li>本專案：`disco/README.md`（v0.1.3，2026-10-23）；`disco/dist/20261023_Disco模型_v0.1.3.xlsx`（In、Q 頁）</li><li>本專案：`先驗與比對/先驗比對_日本候選與Disco_20261023.md`</li><li><a href=\"https://www2.jpx.co.jp/disc/61460/100920260616571483.html\" target=\"_blank\" rel=\"noopener\">DISCO コーポレートガバナンス報告書</a>（2026-06-25）</li><li><a href=\"https://kitaishihon.com/company/6146/board-of-director\" target=\"_blank\" rel=\"noopener\">期待資本：DISCO 役員一覧</a>（查閱 2026-10-25）</li><li><a href=\"https://www.moneypost.jp/1429742\" target=\"_blank\" rel=\"noopener\">マネーポスト：ディスコ第1四半期決算後の株価急落</a>（2026-07-31）</li><li><a href=\"https://jioinc.jp/investleaders/?p=20195\" target=\"_blank\" rel=\"noopener\">Invest Leaders：ディスコ 2027年3月期上期決算</a>（2026-10）</li></ol>"}, "missing": []}, "6857": {"meta": {"ticker": "6857", "name": "Advantest", "name_full": "株式会社アドバンテスト（Advantest Corporation）", "listing": "東證 Prime｜6857", "hq": "日本東京都千代田區 [外部・未經本專案檢核]", "founded": "1954 [外部・未經本專案檢核]", "employees": "本專案未建立", "fiscal_year_end": "3 月底", "asof": "2026-10-25"}, "oneliner": "晶片出廠前「考試」的機器商：AI 加速器（GPU、ASIC）與 HBM 每顆都要上測試機，Advantest 是 SoC 測試機的最大廠，營收主要來自賣測試機 <span class=\"tg\">[本專案：advantest/README.md 開頭]</span>。", "sections": {"公司在做什麼": "<ul><li>主力是 SoC 測試機（SoC：把運算、介面等功能做在同一顆晶片上，例如 GPU、ASIC、CPU），晶片做完後用它檢查每顆是否合格 <span class=\"tg\">[本專案：advantest/README.md 開頭]</span>。</li><li>每顆 AI 晶片的測試時間隨複雜度與世代上升，所以 AI 晶片顆數增加時，測試機需求放大得比顆數快 <span class=\"tg\">[本專案 const XMIN=-1, XMAX=1.5;
function rangeBar(v){
  if(v.cu==null)return `<span class="note">未估值</span>`;
  const sx=x=>((Math.max(XMIN,Math.min(XMAX,x))-XMIN)/(XMAX-XMIN)*100);
  const a=Math.min(v.bu,v.cu), b=Math.max(v.bu,v.cu);
  const over=v.cu>XMAX?`<span class="o" style="right:0">${pct(v.cu)}→</span>`:"";
  return `<div class="rng" title="下檔 ${pct(v.bu)} ～ 中心 ${pct(v.cu)}"><span class="ax"></span><span class="rs" style="left:${sx(a)}%;width:${Math.max(1,sx(b)-sx(a))}%"></span><span class="z" style="left:${sx(0)}%"></span><span class="c ${esc(v.tier)}" style="left:${sx(v.cu)}%"></span>${over}</div>`;
}
function scatter(){
  const W=880,H=420,m={l:56,r:24,t:22,b:44};
  const pts=D.valuation.filter(v=>v.cu!=null).map(v=>({v,x:P[v.tk].score,y:v.cu}));
  const X=x=>m.l+(x-30)/(100-30)*(W-m.l-m.r), Y=y=>m.t+(1-(Math.max(XMIN,Math.min(XMAX,y))-XMIN)/(XMAX-XMIN))*(H-m.t-m.b);
  let g="";
  for(let y=-1;y<=1.5;y+=0.5){g+=`<line class="gl" x1="${m.l}" x2="${W-m.r}" y1="${Y(y)}" y2="${Y(y)}"/><text x="${m.l-8}" y="${Y(y)+4}" text-anchor="end">${pct(y,0)}</text>`;}
  for(let x=30;x<=100;x+=10){g+=`<line class="gl" y1="${m.t}" y2="${H-m.b}" x1="${X(x)}" x2="${X(x)}"/><text x="${X(x)}" y="${H-m.b+16}" text-anchor="middle">${x}</text>`;}
  g+=`<line class="zl" x1="${m.l}" x2="${W-m.r}" y1="${Y(0)}" y2="${Y(0)}"/>`;
  g+=`<text x="${(m.l+W-m.r)/2}" y="${H-6}" text-anchor="middle">地位分數 →</text><text transform="translate(14 ${(m.t+H-m.b)/2}) rotate(-90)" text-anchor="middle">中心空間（隱含價 ÷ 現價 − 1）</text>`;
  g+=`<text class="q" x="${W-m.r-6}" y="${m.t+14}" text-anchor="end">高地位 · 現價未反映</text><text class="q" x="${W-m.r-6}" y="${H-m.b-8}" text-anchor="end">高地位 · 現價已超前</text>`;
  const col={機會:"var(--pos)",觀察:"var(--watch)",偏貴:"var(--neg)"};
  const placed=[];
  pts.sort((a,b)=>b.x-a.x).forEach(p=>{
    const cx=X(p.x), cy=Y(p.y);
    let ly=cy-9, tries=0; while(placed.some(q=>Math.abs(q.x-cx)<64&&Math.abs(q.y-ly)<12)&&tries<6){ly+=13;tries++;}
    placed.push({x:cx,y:ly});
    const clip=p.y>XMAX?`<path d="M${cx-5} ${cy+4} L${cx} ${cy-4} L${cx+5} ${cy+4}" fill="${col[p.v.tier]}"/>`:`<circle cx="${cx}" cy="${cy}" r="5.5" fill="${col[p.v.tier]}" stroke="var(--surface)" stroke-width="1.5"/>`;
    const right=cx>W-m.r-90;
    g+=`<g><title>${esc(p.v.name)}：地位 ${f1(p.x)}，中心空間 ${pct(p.y)}</title>${clip}<text class="lab" x="${right?cx-8:cx+8}" y="${ly+4}" text-anchor="${right?"end":"start"}">${esc(p.v.name)}</text></g>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="地位分數與中心空間散布圖">${g}</svg>`;
}

/* ---------- tabs ---------- */
const views=["map","position","invest","profiles","method"];
function show(v,scrollTo){
  if(!views.includes(v))v="map";
  views.forEach(x=>{$("#v-"+x).hidden=x!==v;$("#t-"+x).setAttribute("aria-selected",x===v);});
  if(scrollTo){const el=document.getElementById("r-"+scrollTo); if(el){el.scrollIntoView({block:"center"}); el.querySelector("details")?.setAttribute("open","");}}
}
document.addEventListener("click",e=>{
  const t=e.target.closest(".tab"); if(t){show(t.dataset.v);try{history.replaceState(null,"","#"+t.dataset.v)}catch(_){};return;}
  const op=e.target.closest("[data-open]"); if(op){e.preventDefault();openDrawer(op.dataset.open);return;}
  if(e.target.closest("#dclose")||e.target.id==="scrim"){closeDrawer();return;}
  const dt=e.target.closest("[data-dt]"); if(dt&&curTk){const i=+dt.dataset.dt; document.querySelectorAll(".dtab[data-dt]").forEach(b=>b.setAttribute("aria-selected",+b.dataset.dt===i)); $("#dpane").innerHTML=paneHtml(PF[curTk],i); decorateMix($("#dpane")); $("#dpane").parentElement.scrollTop=0; return;}
  const gv=e.target.closest("[data-goval]"); if(gv){const t=gv.dataset.goval; closeDrawer(); invFilter="全部"; renderInvest(); show("invest",t); return;}
  const g=e.target.closest("[data-go]"); if(g){e.preventDefault();invFilter="全部";renderInvest();show("invest",g.dataset.go);return;}
  const pf=e.target.closest("[data-pf]"); if(pf){posFilter=pf.dataset.pf;renderPosition();return;}
  const iff=e.target.closest("[data-if]"); if(iff){invFilter=iff.dataset.if;renderInvest();return;}
});
renderMap();renderPosition();renderInvest();renderProfiles();renderMethod();
show((location.hash||"").slice(1));
$("#foot").innerHTML=`算力收支 · 研究整理，非投資建議。數字來源與版本見「方法與來源」。資料活頁簿 ${esc(D.meta.book)}。`;
</script>
