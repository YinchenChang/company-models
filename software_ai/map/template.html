<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 軟體地圖</title>
<style>

:root{
  --paper:#F5F6F8; --surface:#FFFFFF; --sunken:#EEF1F5; --ink:#0F1B2D; --muted:#5A6577; --faint:#8A94A3;
  --rule:#D8DDE4; --rule-strong:#AEB7C3; --navy:#12284A; --navy-ink:#E9EEF6; --navy-muted:#9FB0C9;
  --brass:#8C6A2E; --pos:#1D7A52; --pos-bg:#E3F2EA; --watch:#9A6410; --watch-bg:#F7EDDB; --neg:#B0281F; --neg-bg:#F8E4E2;
  --none:#6B7480; --none-bg:#ECEEF1; --gap:#5B3C88; --gap-bg:#ECE6F5; --bar:#2F4C78; --bar-soft:#C9D4E4;
  --f-display:"Songti TC","Noto Serif TC",Georgia,serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0C1118; --surface:#121923; --sunken:#0F151E; --ink:#E4E9F0; --muted:#9BA6B6; --faint:#6F7A8A;
  --rule:#243041; --rule-strong:#3A4A60; --navy:#0A1626; --navy-ink:#E4EAF3; --navy-muted:#8296B3;
  --brass:#C9A35C; --pos:#55C08E; --pos-bg:#11291F; --watch:#E2A64A; --watch-bg:#2B2213; --neg:#F07A70; --neg-bg:#301717;
  --none:#9AA3AF; --none-bg:#1C2430; --gap:#B79AE6; --gap-bg:#251C36; --bar:#7FA2D6; --bar-soft:#2A3A52; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0C1118; --surface:#121923; --sunken:#0F151E; --ink:#E4E9F0; --muted:#9BA6B6; --faint:#6F7A8A;
  --rule:#243041; --rule-strong:#3A4A60; --navy:#0A1626; --navy-ink:#E4EAF3; --navy-muted:#8296B3;
  --brass:#C9A35C; --pos:#55C08E; --pos-bg:#11291F; --watch:#E2A64A; --watch-bg:#2B2213; --neg:#F07A70; --neg-bg:#301717;
  --none:#9AA3AF; --none-bg:#1C2430; --gap:#B79AE6; --gap-bg:#251C36; --bar:#7FA2D6; --bar-soft:#2A3A52; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num,td.n,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;font-weight:700}
a{color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}


.mast{background:var(--navy);color:var(--navy-ink)}

.mast .wrap{padding-block:28px 22px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--navy-muted);display:flex;gap:10px;align-items:center}
.eyebrow::before{content:"";width:18px;height:2px;background:var(--brass)}
.mast h1{font-size:34px;letter-spacing:.02em;margin-top:8px}

.mast p{margin:8px 0 0;color:var(--navy-muted)}
.meta{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 14px;font-size:12px;color:var(--navy-muted);border-top:1px solid #ffffff2e;margin-top:16px;padding-top:12px}
.meta b{overflow-wrap:anywhere}
.meta b{color:var(--navy-ink);font-weight:500;font-family:var(--f-mono)}


.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--rule);background:var(--surface)}
.kpi{padding:16px 18px;border-right:1px solid var(--rule);min-width:0}
.kpi:last-child{border-right:0}
.kpi .k{font-size:11px;letter-spacing:.08em;color:var(--muted)}
.kpi .v{font-family:var(--f-mono);font-size:26px;font-weight:500;margin-top:2px}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}


.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--rule-strong)}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto}
.tab{appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-weight:500;padding:13px 16px 11px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tab .ix{font-family:var(--f-mono);font-size:11px;color:var(--faint);margin-right:6px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brass)}
.tab:hover{color:var(--ink)}

main{padding-block:26px 56px}
.view{display:grid;gap:22px;grid-template-columns:minmax(0,1fr)}
.view>*{min-width:0}
.head{display:grid;gap:6px}
.head h2{font-size:22px}
.head p{margin:0;color:var(--muted)}
.label{font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:2px}
.panel>.ph{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:12px 16px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.panel>.ph h3{font-size:15px}
.panel>.pb{padding:16px}
.note{font-size:12px;color:var(--muted)}
.tagx{font-family:var(--f-mono);font-size:10.5px;color:var(--faint);white-space:nowrap}


.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;background:var(--surface);border:1px solid var(--rule)}
.flow .st{padding:14px 16px;position:relative;border-right:1px solid var(--rule);min-width:0}
.flow .st:last-child{border-right:0}
.flow .st:not(:last-child)::after{content:"";position:absolute;right:-7px;top:50%;width:12px;height:12px;background:var(--surface);border-top:1px solid var(--rule-strong);border-right:1px solid var(--rule-strong);transform:translateY(-50%) rotate(45deg);z-index:1}
.flow .t{font-size:12px;color:var(--muted)}
.flow .v{font-family:var(--f-mono);font-size:22px;font-weight:500}
.flow .v small{font-size:12px;color:var(--muted);font-weight:400}
.flow .r{font-size:11.5px;color:var(--faint);font-family:var(--f-mono)}


.layer{display:grid;grid-template-columns:220px minmax(0,1fr);border:1px solid var(--rule);background:var(--surface)}
.layer+.layer{border-top:0}
.rail{padding:16px;border-right:1px solid var(--rule);background:var(--sunken);display:grid;gap:6px;align-content:start}
.rail .code{font-family:var(--f-mono);font-size:11px;color:var(--brass);letter-spacing:.08em}
.rail h3{font-size:17px}
.rail .fig{font-family:var(--f-mono);font-size:18px}
.rail .fig small{font-size:11px;color:var(--muted)}
.rail .cap{font-size:12px;color:var(--muted)}
.segs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:0}
.seg{padding:14px 16px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);display:grid;gap:8px;align-content:start;min-width:0}
.seg h4{margin:0;font-size:14px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.seg .irr{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.seg .share{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.sbar{height:6px;background:var(--bar-soft);position:relative}
.sbar i{position:absolute;inset:0 auto 0 0;background:var(--bar)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 8px;border:1px solid var(--rule);background:var(--surface);color:var(--muted);border-radius:2px;text-decoration:none;max-width:100%}
.chip.r{color:var(--ink);border-color:var(--rule-strong);font-weight:500;cursor:pointer}
.chip.r:hover{border-color:var(--ink)}
.chip .d{width:7px;height:7px;border-radius:50%;flex:none;background:var(--none)}
.chip .t{font-family:var(--f-mono);font-size:10.5px;color:var(--faint)}
.d.機會,.d.強力買進,.d.買進{background:var(--pos)} .d.中立{background:var(--watch)} .d.放空,.d.強力放空{background:var(--neg)} .d.機會{background:var(--pos)} .d.觀察{background:var(--watch)} .d.偏貴{background:var(--neg)} .d.未估值{background:var(--none)} .d.收支不足{background:var(--gap)} .d.未上市{background:transparent;border:1.5px solid var(--faint)}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.facility{padding:14px 16px;color:var(--muted);font-size:13px}
.axisB{font-size:12px;color:var(--muted);padding:10px 16px;border-top:1px dashed var(--rule-strong)}


.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;letter-spacing:.06em;color:var(--muted);font-weight:500;text-align:left;padding:9px 10px;border-bottom:1px solid var(--rule-strong);white-space:nowrap;background:var(--surface);position:sticky;top:0}
td{padding:9px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap}
tr:hover td{background:var(--sunken)}
.co b{font-weight:600}
.co .t{font-family:var(--f-mono);font-size:11px;color:var(--faint);margin-left:6px}
.co .s{display:block;font-size:11.5px;color:var(--muted)}
#v-position table{table-layout:fixed;min-width:860px}
.score{display:grid;grid-template-columns:44px minmax(80px,1fr);gap:8px;align-items:center}
.score .b{height:8px;background:var(--bar-soft);position:relative}
.score .b i{position:absolute;inset:0 auto 0 0;background:var(--bar)}
.mini{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:2px;white-space:nowrap}
.pill.強力買進,.pill.買進{color:var(--pos);background:var(--pos-bg)} .pill.強力買進,.pill.強力放空{outline:1.5px solid currentColor;outline-offset:-1.5px} .pill.中立{color:var(--watch);background:var(--watch-bg)} .pill.放空,.pill.強力放空{color:var(--neg);background:var(--neg-bg)} .pill.機會{color:var(--pos);background:var(--pos-bg)} .pill.觀察{color:var(--watch);background:var(--watch-bg)}
.pill.偏貴{color:var(--neg);background:var(--neg-bg)} .pill.未估值{color:var(--none);background:var(--none-bg)} .pill.收支不足{color:var(--gap);background:var(--gap-bg)} .pill.未上市{color:var(--muted);background:transparent;border:1px solid var(--rule-strong)}
.gate{font-size:11.5px;white-space:nowrap} .gate.ok{color:var(--pos)} .gate.no{color:var(--gap);font-weight:600}
.up{color:var(--pos)} .dn{color:var(--neg)}
.flag{font-size:11px;color:var(--watch);display:block}
.stnote{font-size:11px;color:var(--muted);display:block}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.fbtn{appearance:none;font:inherit;font-size:12px;padding:4px 10px;border:1px solid var(--rule-strong);background:var(--surface);color:var(--muted);border-radius:2px;cursor:pointer}
.fbtn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}


.rng{position:relative;height:18px;min-width:180px}
.rng .ax{position:absolute;top:50%;left:0;right:0;height:1px;background:var(--rule)}
.rng .z{position:absolute;top:0;bottom:0;width:1px;background:var(--ink);opacity:.55}
.rng .rs{position:absolute;top:6px;height:6px;background:var(--bar-soft)}
.rng .c{position:absolute;top:3px;width:12px;height:12px;border-radius:50%;transform:translateX(-50%);border:2px solid var(--surface)}
.rng .c.強力買進,.rng .c.買進{background:var(--pos)} .rng .c.中立{background:var(--watch)} .rng .c.放空,.rng .c.強力放空{background:var(--neg)} .rng .c.機會{background:var(--pos)} .rng .c.觀察{background:var(--watch)} .rng .c.偏貴{background:var(--neg)} .rng .c.收支不足{background:var(--gap)}
.rng .o{position:absolute;top:1px;font-size:10px;font-family:var(--f-mono);color:var(--muted)}
details summary{cursor:pointer;color:var(--muted);font-size:12px;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"＋ ";font-family:var(--f-mono)}
details[open] summary::before{content:"－ "}
.det{display:grid;gap:4px;font-size:12px;color:var(--muted);margin-top:6px;max-width:72ch}
.det b{color:var(--ink);font-weight:500}


.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-body);fill:var(--muted);font-size:11px}
.chart .lab{fill:var(--ink);font-size:11px}
.chart .gl{stroke:var(--rule);stroke-width:1}
.chart .zl{stroke:var(--ink);stroke-opacity:.5;stroke-width:1}
.chart .q{fill:var(--brass);font-size:11px;letter-spacing:.06em}

.callouts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.callout{background:var(--surface);border:1px solid var(--rule);padding:12px 14px;display:grid;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
.callout b{color:var(--ink);font-size:13px}
.def{display:grid;grid-template-columns:200px minmax(0,1fr);gap:0;border-top:1px solid var(--rule)}
.def dt,.def dd{padding:10px 12px;border-bottom:1px solid var(--rule);margin:0}
.def dt{font-weight:600;background:var(--sunken)}
.def dd{color:var(--muted);min-width:0}
.def dd code{font-family:var(--f-mono);font-size:12px;color:var(--ink)}

.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:0;border:1px solid var(--rule);background:var(--surface)}
.pcard{appearance:none;text-align:left;font:inherit;color:inherit;background:none;border:0;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:14px 16px;display:grid;gap:6px;cursor:pointer;min-width:0}
.pcard:hover{background:var(--sunken)}
.pcard .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pcard b{font-size:14px}
.pcard .t{font-family:var(--f-mono);font-size:11px;color:var(--faint)}
.pcard p{margin:0;font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.grp{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--brass);margin:6px 0 -12px}
.linkish{appearance:none;background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left}
.linkish:hover b,.linkish:hover{text-decoration:underline;text-underline-offset:3px}

/* ---------- v0.2：公司檔案抽屜（樣式取自 AI 算力地圖 markets/invest_map/template.html，保持一致） ---------- */
/* drawer */
.scrim{position:fixed;inset:0;background:#0b1220;opacity:.38;z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--surface);z-index:21;display:grid;grid-template-rows:auto auto minmax(0,1fr);box-shadow:-12px 0 32px #0000002e;border-left:1px solid var(--rule-strong);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dh{background:var(--navy);color:var(--navy-ink);padding:16px 22px 12px;display:grid;gap:6px}
.dh .row1{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dh h2{font-size:24px}
.dh .sub{font-size:12px;color:var(--navy-muted);font-family:var(--f-mono)}
.dh .one{font-size:13.5px;color:var(--navy-ink);max-width:62ch}
.dh .close{appearance:none;border:1px solid #ffffff40;background:none;color:var(--navy-ink);font:inherit;font-size:12px;padding:4px 10px;cursor:pointer;border-radius:2px;white-space:nowrap}
.dstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--rule)}
.dstats div{padding:10px 14px;border-right:1px solid var(--rule);min-width:0}
.dstats div:last-child{border-right:0}
.dstats .k{font-size:11px;color:var(--muted)}
.dstats .v{font-family:var(--f-mono);font-size:15px}
.dbody{overflow-y:auto;min-height:0;display:block}
.dtabs{display:flex;gap:2px;border-bottom:1px solid var(--rule-strong);padding:0 14px;overflow-x:auto;position:sticky;top:0;background:var(--surface);z-index:1}
.dtab{appearance:none;border:0;background:none;font:inherit;font-size:13px;color:var(--muted);padding:11px 10px 9px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.dtab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brass)}
.dpane{padding:18px 22px 40px;display:grid;gap:18px;align-content:start}
.dsec{display:grid;gap:8px}
.dsec h3{font-family:var(--f-body);font-size:12px;letter-spacing:.1em;color:var(--brass);font-weight:600}
.dsec ul,.dsec ol{margin:0;padding-left:1.2em;display:grid;gap:5px;max-width:70ch}
.dsec p{margin:0;max-width:70ch}
.dsec li{padding-left:2px}
.ptbl{overflow-x:auto;border:1px solid var(--rule)}
.ptbl table{font-size:12.5px}
.mcard{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px 16px;border:1px solid var(--rule);padding:10px 12px;margin:6px 0 10px}
.mcard .k{font-size:11px;color:var(--muted)}.mcard .v{font-size:14px;color:var(--ink)}
.mopen{display:inline-block;border:1px solid var(--rule-strong);padding:6px 12px;color:var(--ink);text-decoration:none;font-size:13px}
.mopen:hover{border-color:var(--brass)}
.mframe{width:100%;height:78vh;min-height:520px;border:1px solid var(--rule);background:#fff;margin-top:8px}
.ptbl th{position:static;background:var(--sunken)}
.ptbl td{vertical-align:top}
.mixbar{display:block;height:5px;background:var(--bar-soft);margin-top:4px;min-width:60px}
.mixbar i{display:block;height:100%;background:var(--bar)}
.tg{font-family:var(--f-mono);font-size:10px;color:var(--faint);overflow-wrap:anywhere}
.sv{border-bottom:1px dotted var(--faint);cursor:help;outline:none}
.sv:hover,.sv:focus{border-bottom-color:var(--brass);background:color-mix(in srgb,var(--brass) 12%,transparent)}
.sm{font-size:9px;color:var(--faint);cursor:help;margin-left:1px;outline:none;vertical-align:super;line-height:0}
.sm:hover,.sm:focus{color:var(--brass)}
#srctip{position:fixed;z-index:40;max-width:min(420px,calc(100vw - 24px));background:var(--navy,#14213d);color:#fff;font-family:var(--f-mono);font-size:11px;line-height:1.45;padding:7px 9px;border-radius:3px;box-shadow:0 6px 18px #0000003a;pointer-events:none;overflow-wrap:anywhere}
#srctip .h{font-family:var(--f-body);font-size:10px;letter-spacing:.08em;opacity:.7;margin-bottom:2px}
details.srcs{margin-top:18px;border-top:1px solid var(--rule);padding-top:8px;font-size:11.5px;color:var(--muted)}
details.srcs summary{cursor:pointer;font-size:11.5px;color:var(--muted)}
details.srcs h4{margin:8px 0 2px;font-size:11px;font-weight:600;color:var(--brass);letter-spacing:.06em}
details.srcs ol{margin:0;padding-left:1.6em;display:grid;gap:2px;font-family:var(--f-mono);font-size:10.5px;overflow-wrap:anywhere}
.dmeta{display:flex;flex-wrap:wrap;gap:2px 18px;font-size:12px;color:var(--muted)}
.dmeta .mi{display:inline-flex;gap:6px}
.dmeta b{color:var(--ink);font-weight:500}
.ev li{list-style:none;margin-left:-1.2em;padding-left:0;border-left:2px solid var(--rule-strong);padding:2px 0 2px 12px}
.pending{padding:22px;color:var(--muted)}
@media (max-width:600px){.dstats{grid-template-columns:repeat(2,minmax(0,1fr))}.dstats div:nth-child(2){border-right:0}.dh h2{font-size:20px}}

.sv[data-src]{outline:none}
button.chip{appearance:none;font-family:inherit;line-height:inherit;cursor:pointer}
button.chip.m:hover{border-color:var(--ink)}
.fbtn[disabled]{opacity:.45;cursor:default}
.mopen.off{color:var(--faint);border-style:dashed;pointer-events:none}
.pcard .ver{font-family:var(--f-mono);font-size:11px;color:var(--faint)}

footer{border-top:1px solid var(--rule);padding-block:18px 28px;color:var(--faint);font-size:12px}

@media (max-width:900px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi:nth-child(2){border-right:0} .kpi:nth-child(-n+2){border-bottom:1px solid var(--rule)}
  .flow{grid-template-columns:repeat(2,minmax(0,1fr))}
  .flow .st:nth-child(2){border-right:0}.flow .st:nth-child(-n+2){border-bottom:1px solid var(--rule)}
  .flow .st::after{display:none}
  .layer{grid-template-columns:1fr}
  .rail{border-right:0;border-bottom:1px solid var(--rule)}
  .callouts{grid-template-columns:1fr}
  .def{grid-template-columns:1fr}
}
@media (max-width:480px){.mast h1{font-size:28px}.kpi .v{font-size:22px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---------- 軟體地圖專用 ---------- */
.site-switch{display:flex;gap:0;margin:0 0 14px;border:1px solid #ffffff40;width:max-content;max-width:100%}
.site-switch a,.site-switch span{padding:5px 16px;font-size:12.5px;letter-spacing:.06em;color:var(--navy-muted);text-decoration:none;border-right:1px solid #ffffff2e;white-space:nowrap}
.site-switch>*:last-child{border-right:0}
.site-switch a:hover{color:var(--navy-ink)}
.site-switch [aria-current="page"]{background:var(--navy-ink);color:var(--navy);font-weight:600}
.aid{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:2px;white-space:nowrap}
.aid.受益{color:var(--pos);background:var(--pos-bg)} .aid.分歧{color:var(--watch);background:var(--watch-bg)} .aid.侵蝕{color:var(--neg);background:var(--neg-bg)}
.seg .meta2{display:grid;gap:2px;font-size:12px;color:var(--muted)}
.seg .meta2 b{color:var(--ink);font-weight:500}
.chip.m{border-color:var(--rule-strong);color:var(--ink);font-weight:500}
a.chip.m:hover{border-color:var(--ink)}
.chip.rev{border-style:dashed}
.d.未建模{background:transparent;border:1.5px solid var(--faint)}
.neg{color:var(--neg)} .pos{color:var(--pos)}
.tbl table.v{min-width:1180px}
.tbl table.v td,.tbl table.v th{padding:9px 8px}
.tbl small{display:block;font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.sbcn{color:var(--muted)}
.mcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:0;border:1px solid var(--rule);background:var(--surface)}
.mc{padding:16px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);display:grid;gap:8px;align-content:start;min-width:0}
.mc h3{font-size:17px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.mc .tk{font-family:var(--f-mono);font-size:11px;color:var(--faint)}
.mc .row{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted)}
.mc .row b{color:var(--ink);font-weight:500;font-family:var(--f-mono)}
.mc .warn{font-size:11.5px;color:var(--watch)}
.mopen.off{color:var(--faint);border-style:dashed;pointer-events:none}
.sub-h{font-family:var(--f-body);font-size:12px;letter-spacing:.1em;color:var(--brass);font-weight:600;margin:0}
.srcnote{font-size:11.5px;color:var(--muted)}
.tbl table.u{min-width:640px}
.dim{color:var(--faint)}
.leg-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:middle}
.defs{display:grid;gap:0;border-top:1px solid var(--rule)}
ul.lim{margin:0;padding-left:1.2em;display:grid;gap:5px;color:var(--muted)}
.sv{border-bottom:1px dotted var(--faint);cursor:help}
.gate{display:block}
</style>
</head>
<body>
<header class="mast">
  <div class="wrap">
    <nav class="site-switch" aria-label="地圖">
      <a href="../">算力</a>
      <a href="../physical_ai/">實體 AI</a>
      <span aria-current="page">軟體 AI</span>
    </nav>
    <div>
      <div class="eyebrow">AI 軟體應用 · 價值重分配研究</div>
      <h1>AI 軟體地圖</h1>
      <p>追蹤 AI 進入軟體與網路服務後，價值在模型層、平台層、應用層之間如何重新分配：哪些企業軟體、SaaS、IT 服務、網路平台與 AI 原生應用公司因 AI 受益或被侵蝕。先看五個計價原型的單位經濟，再看各次產業的覆蓋公司、地位與個股模型估值。點任何一家已建模的公司，開啟公司檔案（背景、競爭、客戶與股東、管理層、動態、個股模型）。</p>
    </div>
    <div class="meta" id="meta"></div>
  </div>
</header>
<section class="kpis" id="kpis" aria-label="摘要"></section>
<nav class="tabs" aria-label="視角">
  <div class="wrap" role="tablist">
    <button class="tab" role="tab" id="t-map" data-v="map" aria-selected="true"><span class="ix">01</span>產業地圖</button>
    <button class="tab" role="tab" id="t-position" data-v="position" aria-selected="false"><span class="ix">02</span>產業地位</button>
    <button class="tab" role="tab" id="t-invest" data-v="invest" aria-selected="false"><span class="ix">03</span>可投資性</button>
    <button class="tab" role="tab" id="t-profiles" data-v="profiles" aria-selected="false"><span class="ix">04</span>公司檔案</button>
    <button class="tab" role="tab" id="t-method" data-v="method" aria-selected="false"><span class="ix">附</span>方法與來源</button>
  </div>
</nav>
<main class="wrap">
  <section class="view" id="v-map"></section>
  <section class="view" id="v-position" hidden></section>
  <section class="view" id="v-invest" hidden></section>
  <section class="view" id="v-profiles" hidden></section>
  <section class="view" id="v-method" hidden></section>
</main>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-modal="true" role="dialog" aria-labelledby="dname"></aside>
<footer><div class="wrap" id="foot"></div></footer>
<script>
const D = /*__DATA__*/null;
const DASH = "—";
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nf = (v, d = 0) => v == null ? DASH : Number(v).toLocaleString("en-US", {minimumFractionDigits: d, maximumFractionDigits: d});
const pct = (v, d = 1) => v == null ? DASH : (v > 0 ? "+" : "") + (v * 100).toFixed(d) + "%";
const pct0 = (v, d = 1) => v == null ? DASH : (v * 100).toFixed(d) + "%";
const SYM = {USD: "US$", JPY: "¥", KRW: "₩", TWD: "NT$", HKD: "HK$", CNY: "¥"};
const srcOf = o => (o && o.cell) ? ((o.file ? o.file.split("/").pop() + " " : D.ue.file_name + " ") + o.cell + (o.label ? "｜" + o.label : "")) : "";
const sv = (o, txt) => (o && o.value != null) ? `<span class="sv" title="${esc(srcOf(o))}">${txt}</span>` : DASH;
const LAYERS = D.layers, SUBS = Object.fromEntries(D.subs.map(s => [s.code, s]));
const RCLS = r => r || "未估值";
const PF = D.profiles || {};
const TIER = tk => { const m = D.models[tk]; return m && m.status === "ok" ? (m.tier || "未估值") : "未估值"; };
const f1 = x => x == null ? DASH : Number(x).toFixed(1);

/* ---------- header ---------- */
function renderHead() {
  const m = D.meta;
  $("#meta").innerHTML =
    `<span>版本</span><b>${esc(m.version)}（建置 ${esc(m.built)}）</b>` +
    `<span>地位活頁簿</span><b>${esc(m.position_book)}</b>` +
    `<span>單位經濟</span><b>${esc(m.ue_file)}（${esc(m.ue_version)}，${esc(m.ue_date)}）</b>` +
    `<span>個股模型</span><b>${esc(m.models_note)}</b>`;
  $("#kpis").innerHTML = D.kpis.map(k => `<div class="kpi"><div class="k">${esc(k.k)}</div><div class="v">${esc(k.v)}</div><div class="s">${esc(k.s)}</div></div>`).join("");
  $("#foot").innerHTML = `資料日期：現價 ${esc(m.price_dates)}；單位經濟 ${esc(m.ue_date)}；相對倍數庫 ${esc(m.relmult_date)}；抽數 ${esc(m.extract_date)}。本頁所有數字來自 data.json（抽自各模型成品與活頁簿），網頁只呈現、不計算。游標停在數字上顯示來源儲存格。`;
}

/* ---------- 01 map ---------- */
function ratingDot(tk) {
  const m = D.models[tk];
  if (!m) return null;
  return m.status === "ok" ? (m.rec && m.rec.value || "未估值") : "未估值";
}
function chip(c) {
  const m = D.models[c.tk];
  const t = `<span class="t">${esc(c.tk)}</span>`;
  if (m && m.status === "ok") {
    return `<button class="chip m" data-open="${esc(c.tk)}" title="${esc("開啟公司檔案｜個股模型 " + m.version + "｜" + TIER(c.tk))}"><span class="d ${esc(TIER(c.tk))}"></span>${esc(c.short)} ${t}</button>`;
  }
  if (m) return `<span class="chip m rev" title="個股模型改版中（dist 無現行成品）"><span class="d 未估值"></span>${esc(c.short)} ${t}</span>`;
  return `<span class="chip" title="${esc(c.map_owner)}"><span class="d 未建模"></span>${esc(c.short)} ${t}</span>`;
}
function renderMap() {
  const U = D.ue;
  let h = `<div class="head"><h2>五個計價原型的 AI 淨效果</h2><p>計算單位一律是「AI 前的 1 個單位」。淨效果＝AI 營收增量 − 定價侵蝕 − 推論成本；表中為淨效果占 AI 前單位營收的比。參數多為假設、區間寬，讀方向與量級，不當點估計。IT 服務的負值是營收移轉（人力自動化省下的交付成本不在此計），不等於廠商毛利受損。</p></div>`;
  h += `<div class="panel"><div class="ph"><h3>原型單位 AI 淨效果占單位營收比</h3><span class="tagx">${esc(U.file_name)}｜${esc(U.version)}</span></div><div class="tbl"><table class="u"><thead><tr><th>原型</th><th>適用次產業</th><th class="n">${U.years[0]}</th><th class="n">${U.years[1]}</th><th class="n">${U.years[2]}</th><th class="n">毛利率 ${U.years[0]}</th><th class="n">毛利率 ${U.years[2]}</th><th class="n">推論成本占營收成本 ${U.years[1]}</th></tr></thead><tbody>`;
  for (const a of U.archetypes) {
    const nv = y => { const o = a.netr && a.netr[y]; return o ? `<td class="n ${o.value < 0 ? "neg" : "pos"}">${sv(o, pct(o.value))}</td>` : `<td class="n">${DASH}</td>`; };
    const g = y => { const o = a.gm && a.gm[y]; return `<td class="n">${o ? sv(o, pct0(o.value)) : DASH}</td>`; };
    const ih = a.infsh && a.infsh[U.years[1]];
    h += `<tr><td><b>${esc(a.code)}｜${esc(a.name)}</b></td><td>${esc(a.scope)}</td>${nv(U.years[0])}${nv(U.years[1])}${nv(U.years[2])}${g(U.years[0])}${g(U.years[2])}<td class="n">${ih ? sv(ih, pct0(ih.value)) : DASH}</td></tr>`;
  }
  h += `</tbody></table></div></div>`;
  h += `<div class="panel"><div class="ph"><h3>第一批五個次產業：${U.years[1]} 年 AI 淨效果與移轉金額</h3><span class="tagx">十億美元（全球營收池口徑見單位經濟模型）</span></div><div class="tbl"><table class="u"><thead><tr><th>次產業</th><th>原型</th><th class="n">營收池（不含 AI）</th><th class="n">AI 淨效果</th><th class="n">AI 移轉金額</th><th class="n">淨效果 ÷ 營收池</th></tr></thead><tbody>`;
  for (const s of U.subs) {
    const c = k => s[k] && s[k][U.years[1]];
    const n = c("net"), x = c("xfer"), b = c("base"), r = c("netsh");
    h += `<tr><td><b>${esc(s.name)}</b><span class="tagx"> ${esc(s.code)}</span></td><td>${esc(s.archetype)}</td><td class="n">${b ? sv(b, nf(b.value, 1)) : DASH}</td><td class="n ${n && n.value < 0 ? "neg" : "pos"}">${n ? sv(n, nf(n.value, 1)) : DASH}</td><td class="n">${x ? sv(x, nf(x.value, 1)) : DASH}</td><td class="n">${r ? sv(r, pct(r.value)) : DASH}</td></tr>`;
  }
  h += `</tbody></table></div></div>`;
  h += `<div class="head"><h2>價值鏈地圖：五層、${D.subs.length} 個次產業</h2><p>每格列次產業、AI 方向（判斷，不進分數）、計價原型、全球營收池與覆蓋公司。有個股模型者標評等色，點擊開啟公司檔案（個股模型在檔案的「個股模型」分頁）；虛線框為模型改版中；空心圓為尚未建模。</p></div>`;
  h += `<div class="legend"><span><i class="d 買進 leg-dot"></i>買進以上</span><span><i class="d 中立 leg-dot"></i>中立</span><span><i class="d 放空 leg-dot"></i>放空以下</span><span><i class="d 收支不足 leg-dot"></i>收支不足</span><span><i class="d 未估值 leg-dot"></i>模型改版中</span><span><i class="d 未建模 leg-dot"></i>尚未建模</span></div>`;
  for (const L of LAYERS) {
    h += `<div class="layer"><div class="rail"><span class="code">${esc(L.code)}</span><h3>${esc(L.title)}</h3><div class="cap">${L.subs.length} 個次產業｜覆蓋 ${L.n_cov} 家｜已建模 ${L.n_model} 家</div></div><div class="segs">`;
    for (const code of L.subs) {
      const s = SUBS[code];
      h += `<div class="seg"><h4><span>${esc(s.name)}</span><span class="irr">${esc(s.code)}</span></h4>` +
        `<div><span class="aid ${esc(s.ai)}">AI ${esc(s.ai)}</span></div>` +
        `<div class="meta2"><span>計價：<b>${esc(s.pricing)}</b></span><span>營收池：<b>${esc(s.pooltext)}</b></span>${s.archetype ? `<span>單位經濟原型：<b>${esc(s.archetype)}</b></span>` : ""}</div>` +
        `<div class="chips">${s.companies.map(chip).join("")}</div></div>`;
    }
    h += `</div></div>`;
  }
  $("#v-map").innerHTML = h;
}

/* ---------- 02 position ---------- */
const POSN = {1: "龍頭", 2: "前二／寡占", 3: "主要參與者", 4: "追隨者"};
let posFilter = "ALL";
function renderPosition() {
  let h = `<div class="head"><h2>產業地位</h2><p>地位分數衡量「今天的市場地位」，不衡量 AI 讓它變好或變壞（後者是單位經濟與個股模型要回答的）。公司重要性 1 最重要；市場位置 1 龍頭、4 追隨者。亞太掛牌：「是」＝在日、韓、台、港、澳洲或中國 A 股掛牌。地圖歸屬：跨圖者以主圖模型為準。已建模的公司（名稱旁有評等）可點名稱開啟公司檔案。</p></div>`;
  h += `<div class="filters" id="pf"><button class="fbtn" data-f="ALL" aria-pressed="${posFilter === "ALL"}">全部（${D.position.length}）</button>` +
    D.subs.map(s => `<button class="fbtn" data-f="${esc(s.code)}" aria-pressed="${posFilter === s.code}">${esc(s.code)}（${s.n}）</button>`).join("") + `</div>`;
  const rows = D.position.filter(p => posFilter === "ALL" || p.sub === posFilter);
  h += `<div class="panel"><div class="tbl"><table style="min-width:980px"><thead><tr><th class="n">排名</th><th>公司</th><th>市場</th><th>亞太掛牌</th><th>次產業</th><th class="n">重要性</th><th>市場位置</th><th style="width:150px">地位分數</th><th>AI 方向</th><th>地圖歸屬</th></tr></thead><tbody>`;
  for (const p of rows) {
    const m = D.models[p.tk];
    const mp = m && m.status === "ok" && m.rec ? ` <span class="pill ${esc(m.rec.value)}">${esc(m.rec.value)}</span>` : "";
    h += `<tr><td class="n">${p.rank_all == null ? DASH : nf(p.rank_all)}</td><td class="co">${m && m.status === "ok" ? `<button class="linkish" data-open="${esc(p.tk)}"><b>${esc(p.name)}</b></button>` : `<b>${esc(p.name)}</b>`}<span class="t">${esc(p.tk)}</span>${mp}<span class="s">${esc(p.basis)}</span></td><td>${esc(p.market)}</td><td>${esc(p.apac)}</td><td>${esc(p.sub_name)}<span class="tagx"> ${esc(p.sub)}</span></td><td class="n">${esc(p.imp)}</td><td>${esc(POSN[p.posn] || p.posn)}</td><td><div class="score"><span class="num">${nf(p.score, 1)}</span><span class="b"><i style="width:${Math.max(0, Math.min(100, p.score))}%"></i></span></div></td><td><span class="aid ${esc(p.ai)}">${esc(p.ai)}</span></td><td>${esc(p.map_owner)}</td></tr>`;
  }
  h += `</tbody></table></div></div>`;
  $("#v-position").innerHTML = h;
}

/* ---------- 03 valuation ---------- */
function money(m, v, d) { return v == null ? DASH : (SYM[m.ccy] || m.ccy || "") + nf(v, d); }
function relCell(m) {
  const r = m.relmult;
  if (!r || r.geo_base == null) return DASH;
  const tip = `PS 讀數 ${r.ps_reading == null ? DASH : r.ps_reading.toFixed(2)}；PSG 讀數 ${r.psg_reading == null ? DASH : r.psg_reading.toFixed(2)}｜${r.file.split("/").pop()}`;
  return `<span class="sv" title="${esc(tip)}">${r.geo_base.toFixed(2)}x</span><small>PS ${r.ps_reading == null ? DASH : r.ps_reading.toFixed(2)}／PSG ${r.psg_reading == null ? DASH : r.psg_reading.toFixed(2)}</small>` +
    (r.divergence_gt_30pct ? `<small class="neg">兩讀數差異大</small>` : "");
}
const YMIN = -1, YMAX = 1, XLO = 60, XHI = 100;
const TIERS = ["強力買進", "買進", "中立", "放空", "強力放空", "收支不足", "未上市"];
const TCOL = {強力買進: "var(--pos)", 買進: "var(--pos)", 中立: "var(--watch)", 放空: "var(--neg)", 強力放空: "var(--neg)", 收支不足: "var(--gap)", 未估值: "var(--none)"};
function scatter() {
  const W = 880, H = 420, mg = {l: 56, r: 24, t: 22, b: 44};
  const pts = D.model_order.map(tk => D.models[tk]).filter(m => m.status === "ok" && m.upside && m.score != null).map(m => ({m, x: m.score, y: m.upside.value}));
  const X = x => mg.l + (Math.max(XLO, Math.min(XHI, x)) - XLO) / (XHI - XLO) * (W - mg.l - mg.r);
  const Y = y => mg.t + (1 - (Math.max(YMIN, Math.min(YMAX, y)) - YMIN) / (YMAX - YMIN)) * (H - mg.t - mg.b);
  let g = "";
  for (let i = 0; i <= 8; i++) { const y = YMIN + i * 0.25; g += `<line class="gl" x1="${mg.l}" x2="${W - mg.r}" y1="${Y(y)}" y2="${Y(y)}"/><text x="${mg.l - 8}" y="${Y(y) + 4}" text-anchor="end">${pct(y, 0)}</text>`; }
  for (let x = XLO; x <= XHI; x += 10) g += `<line class="gl" y1="${mg.t}" y2="${H - mg.b}" x1="${X(x)}" x2="${X(x)}"/><text x="${X(x)}" y="${H - mg.b + 16}" text-anchor="middle">${x}</text>`;
  g += `<line class="zl" x1="${mg.l}" x2="${W - mg.r}" y1="${Y(0)}" y2="${Y(0)}"/>`;
  g += `<text x="${(mg.l + W - mg.r) / 2}" y="${H - 6}" text-anchor="middle">地位分數 →</text><text transform="translate(14 ${(mg.t + H - mg.b) / 2}) rotate(-90)" text-anchor="middle">中心空間（加權目標價 ÷ 現價 − 1）</text>`;
  g += `<text class="q" x="${W - mg.r - 6}" y="${mg.t + 14}" text-anchor="end">高地位 · 現價未反映</text><text class="q" x="${W - mg.r - 6}" y="${H - mg.b - 8}" text-anchor="end">高地位 · 現價已超前</text>`;
  const placed = [];
  pts.sort((p, q) => q.x - p.x || q.y - p.y).forEach(p => {
    const cx = X(p.x), cy = Y(p.y);
    const right = cx > W - mg.r - 150;
    let ly = cy - 9, tries = 0;
    while (placed.some(q => q.right === right && Math.abs(q.x - cx) < 120 && Math.abs(q.y - ly) < 12) && tries < 8) { ly += 13; tries++; }
    placed.push({x: cx, y: ly, right});
    const mark = p.y > YMAX ? `<path d="M${cx - 5} ${cy + 4} L${cx} ${cy - 4} L${cx + 5} ${cy + 4}" fill="${TCOL[p.m.tier]}"/>` : `<circle cx="${cx}" cy="${cy}" r="5.5" fill="${TCOL[p.m.tier] || "var(--none)"}" stroke="var(--surface)" stroke-width="1.5"/>`;

  let h = `<div class="head"><span class="label">附錄</span><h2>方法與來源</h2><p>本頁說明地圖怎麼排、數字從哪來、哪些地方不能當真。數字一律來自活頁簿與模型成品；公司檔案的來源規則見「公司檔案」一節。</p></div>`;
  h += sec("地位分數", `<p>地位分數 ＝ ${P.w_irr} × 不可替代性分 ＋ ${P.w_pos} × 市場位置分 ＋ ${P.w_vc} × 價值鏈分量分。不可替代性分＝（次產業不可替代性換分＋公司重要性換分）÷ 2（1→${P.s_irr1}、2→${P.s_irr2}、3→${P.s_irr3}）。市場位置：龍頭→${P.s_pos1}、前二或寡占→${P.s_pos2}、主要參與者→${P.s_pos3}、追隨者→${P.s_pos4}。軟體沒有 BOM，價值鏈分量改用「次產業全球營收池」分級。同一公司可出現在多個次產業，排名以列計。</p>`);
  h += sec("營收池分級", `<p>營收池中值（十億美元）≥ ${P.pool_t1} → 100；≥ ${P.pool_t2} → 75；≥ ${P.pool_t3} → 50；以下 25。營收池來自第三方研調與公司揭露（標 Analogy 或 Interested-party），為區間中值，單位經濟模型完成的次產業以模型為準。</p>`);
  h += sec("單位經濟五原型", `<p>計算單位是「AI 前的 1 個單位」：按人力（L）、按席位（S）、按廣告（A）、按用量（U）、按防護範圍（P）。每個原型逐年（${D.ue.years.join("、")} 與其間年份）算：AI 營收增量、定價侵蝕、推論成本，淨效果＝增量 − 侵蝕 − 推論成本。推論成本只讀 Tokenomics 快照（${esc(D.ue.tokenomics)}），不自行估價；未來 token 單價路徑尚待登錄，以區間作敏感度。毛利路徑與推論成本占營收成本比同表呈現。</p>`);
  h += sec("相對倍數：PS ＋ PSG", `<p>Comparable 使用的相對倍數，取本公司對同業的「歷史相對值」：PS＝市值 ÷ TTM 營收；PSG＝PS ÷ TTM 營收年增（以百分點計）。兩條序列各取最近 ${D.relmult_window} 個財季，有效點少於 ${D.relmult_min} 者只作參考、不進基準。PS 讀數＝PS 歷史相對中位數；PSG 讀數＝PSG 歷史相對中位數 × 目前本公司對同業的成長比。基準＝兩讀數的幾何平均；兩讀數差異過大時須寫明原因。規格見 software_ai/docs/plan 的「歷史相對倍數」。</p>`);
  h += sec("DCF 與評等規格", `<ul class="lim">${D.dcf_spec.map(t => `<li>${esc(t)}</li>`).join("")}</ul>`);
  h += sec("評等五級", `<div class="defs"><dl class="def" style="margin:0">${D.rating_bands.map(b => `<dt>${esc(b.name)}</dt><dd>${esc(b.rule)}</dd>`).join("")}</dl></div>`);
  h += sec("公司檔案", `<p>每家已建模的公司一份 Markdown（software_ai/map/profiles/&lt;代號&gt;.md），格式與 AI 算力地圖的公司檔案相同。數字只取本專案檔案（研究包、個股模型成品），標「本專案」並記檔案位置；本專案沒有的數字寫「本專案未建立」。管理層身分、主要客戶、前十大股東取自公司申報與股東資料，標「外部・未經本專案檢核」；近期重大事件取自新聞，標「外部新聞」。背景知識用途，不含目標價與評等（這兩項只由個股模型帶入）。個股模型成品嵌在檔案的「個股模型」分頁。已完成 ${Object.keys(PF).length} 家。</p>`);
  h += sec("限制與未找到摘要", `<ul class="lim">${D.limits.map(t => `<li>${esc(t)}</li>`).join("")}</ul>`);
  h += sec("資料日期與來源", `<div class="defs"><dl class="def" style="margin:0">${D.sources.map(s => `<dt>${esc(s.k)}</dt><dd>${esc(s.v)}</dd>`).join("")}</dl></div>`);
  $("#v-method").innerHTML = h;
}

/* ---------- tabs ---------- */
const VIEWS = ["map", "position", "invest", "profiles", "method"];
const ALIAS = {val: "invest", models: "profiles"};          // v0.1 的分頁錨點
function show(v, scrollTo) {
  v = ALIAS[v] || v;
  if (!VIEWS.includes(v)) v = "map";
  for (const x of VIEWS) {
    $("#v-" + x).hidden = x !== v;
    $("#t-" + x).setAttribute("aria-selected", x === v ? "true" : "false");
  }
  if (scrollTo) { const el = document.getElementById("r-" + scrollTo); if (el) el.scrollIntoView({block: "center"}); }
}
document.addEventListener("click", e => {
  const c = e.target.closest ? e.target : e.target.parentNode;
  const t = c.closest(".tab");
  if (t) { show(t.dataset.v); try { history.replaceState(null, "", "#" + t.dataset.v); } catch (_) {} return; }
  if (c.closest("#dclose") || c.closest("#scrim")) { closeDrawer(); return; }
  const gv = c.closest("[data-goval]");
  if (gv) { const tk = gv.dataset.goval; closeDrawer(); invFilter = "全部"; renderInvest(); show("invest", tk); try { history.replaceState(null, "", "#invest"); } catch (_) {} return; }
  const dt = c.closest(".dtab[data-dt]");
  if (dt) { setPane(+dt.dataset.dt); return; }
  const op = c.closest("[data-open]");
  if (op) { e.preventDefault(); openDrawer(op.dataset.open, +(op.dataset.tab || 0)); return; }
  const iff = c.closest("[data-if]");
  if (iff) { if (!iff.disabled) { invFilter = iff.dataset.if; renderInvest(); } return; }
  const f = c.closest("#pf .fbtn");
  if (f) { posFilter = f.dataset.f; renderPosition(); }
});
renderHead(); renderMap(); renderPosition(); renderInvest(); renderProfiles(); renderMethod();
show((location.hash || "").slice(1));
</script>
