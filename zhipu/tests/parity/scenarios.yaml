# Parity 情境檔（CLAUDE.md 第 3 節）。每個情境：改寫輸入 → LibreOffice 重算（基準）→ 與 engine 比對全部公式格。
# 輸入以具名範圍設定（SRC_ZP_nnn、INP_nnn、TK_*；多格名稱用 NAME[k]）。v0.1-Z2：Demand、Revenue、Checks；v0.1-Z3：Compute、Cost。
workbook_expectations:            # 版本升級時必須有意識地更新（CLAUDE.md 第 4 節）
  sheets: [README, SRC_ZP, TK_Link, OAI_Link, Inputs, Demand, Revenue, Compute, Cost, Checks, _Defaults]
  formula_cells: 3834             # Z3：Z2 的 2,644 ＋ Inputs 檢查欄 ＋Compute＋Cost＋Checks 新列（builder 重建時有意識地更新）
  defined_names: 1006             # Z2 887 − INP_072（退役）＋ INP 46（INP_074–120）＋ CMP_／COST_ 具名範圍
  src_rows: 604                   # SRC_ZP 筆數（Z1 資料報告）
  src_named: 655                  # SRC_ZP_nnn（有數值 570）＋_Lo（46）＋_Hi（39）
  inp_rows: 119                   # data/zhipu_inputs.yaml（Z3：＋46、INP_072 退役）
  tk_values: 63                   # TK_IF_／TK_SRC_／TK_L1_（同 OpenAI v0.6）
  tk_table: 7                     # TK_RD_（以列標籤讀表；只供對照）
  oai_named: 18                   # OAI_ 14 個輸出列＋4 個中繼（檔名、SHA-256、分支、讀取日）
  tk_pending: 0

# 預期轉 ERR 的檢查（保證檢查有牙齒）；未列出的情境不得有任何 ERR
expected_errors:
  k2_rev_total_mismatch: [C17]
  h_cp_mix_broken: [C23]
  i_cp_subs_exceed_api: [C06, C21]
  j_input_out_of_range: [C06]
  l_era_overflow: [C06, C25]
  p_sol_share_broken: [C06, C24]
  q_onprem_k_out: [C06, C26]
  z_chip_share_broken: [C43]
  aa_rd_fee_too_high: [C06, C53]
  ac_cap_binding: [C06]

scenarios:
  - id: base
    description: 基準（不改任何輸入）
    inputs: {}
  - id: a_price_cut_fast
    description: 價格變動：Sol 牌價年變動率 −20%→−40%（區間下緣）；2027 起 Sol 牌價、有效單價下降，價格反應使任務數與 token 上升
    inputs: {"INP_035": -0.4}
  - id: b_elasticity_high
    description: 彈性：任務數價格彈性 −0.7→−1.05（區間下緣）；2H26 漲價使量降更多、2027 起降價使量升更多
    inputs: {"INP_045": -1.05}
  - id: c_onprem_growth
    description: 本地化成長：2027 起年增率 0%→+20%（區間上緣）；②③④與總額上升，雲端 token 不變（D4）
    inputs: {"INP_070": 0.2}
  - id: d_onprem_flat_2h26
    description: 本地化 2H26 延續係數 0→1（R2 後基準為持平；改為逐線延續上半年同比）；2026 起本地化營收上升
    inputs: {"INP_069": 1}
  - id: e_cp_mix_pro
    description: Coding Plan 組合：Lite 0.6→0.4、Pro 0.3→0.45（Max 0.15）；加權月價、訂閱營收、每訂閱者 token 上升；1H26 按量計費倒推值下降
    inputs: {"INP_055": 0.4, "INP_056": 0.45}
  - id: f_tier_mix_sol
    description: 層級組合：2026 Sol 占比 0.7→0.85；組合有效單價上升，1H26 倒推 token 下降
    inputs: {"INP_033": 0.85}
  - id: g_fx_weak_rmb
    description: 匯率：USD/CNY 6.7399→7.0769（＋5%）；國際站 Coding Plan 人民幣價、ARR 對照、TK 價格對照連動
    inputs: {"INP_023": 7.0769}
  - id: h_cp_mix_broken
    description: Coding Plan 組合 Lite 0.8＋Pro 0.45＞1，Max＜0（C23 應轉 ERR）
    inputs: {"INP_055": 0.8, "INP_056": 0.45}
  - id: i_cp_subs_exceed_api
    description: Coding Plan 1H26 訂閱者倍數 1→8（超出區間）：估計訂閱營收超過 API 實際，按量計費倒推 ≤0（C21、C06 應轉 ERR）
    inputs: {"INP_048": 8}
  - id: j_input_out_of_range
    description: 折扣與免費額度 0.25→0.6，超出高端 0.4（C06 應轉 ERR）；有效單價下降、倒推 token 上升
    inputs: {"INP_031": 0.6}
  - id: k_rev_api_2025
    description: 校準：FY2025 開放平台及 API 實際營收 1.9038→2.5（SRC_ZP_112）、營收總額同步 7.2433→7.8395（SRC_ZP_120）；按量計費倒推 token 上升，校準差距仍為 0
    inputs: {"SRC_ZP_112": 2.5, "SRC_ZP_120": 7.8395}
  - id: k2_rev_total_mismatch
    description: 只改 FY2025 開放平台及 API 實際營收（SRC_ZP_112 1.9038→2.5）、不改總額：分部合計≠年報總額（C17 應轉 ERR）
    inputs: {"SRC_ZP_112": 2.5}
  - id: l_era_overflow
    description: GLM-4.7 期間天數 42→150，GLM-5.1 期間權重為負（C25、C06 應轉 ERR）
    inputs: {"INP_026": 150}
  - id: m_tk_table_value
    description: TK 讀表列：GLM-5.3 國際站輸出價 4.4→6.0（TK_RD_CapIn_GLM53[3]）；只影響對照列，不影響營收
    inputs: {"TK_RD_CapIn_GLM53[3]": 6.0}
  - id: n_task_growth_high
    description: 2H26 任務數成長 +224%→+300%（區間上緣；R1 後基準 2.24）；2H26 起 API token、營收、ARR 對照連動
    inputs: {"INP_038": 3.0}
  - id: o_cp_util_high
    description: Coding Plan 額度使用率 0.15→0.4（區間上緣）；Coding Plan token 與 DEM_Tok_* 上升，營收不變
    inputs: {"INP_060": 0.4}
  - id: p_sol_share_broken
    description: 2027 起 Sol 占比 0.7→1.2（Luna 為負；C24、C06 應轉 ERR）
    inputs: {"INP_034": 1.2}
  - id: q_onprem_k_out
    description: 本地化延續係數 1→1.5（C26、C06 應轉 ERR）
    inputs: {"INP_069": 1.5}
  - id: r_long_ctx
    description: 長上下文占比 0.6→0.9；2025、1H26 Sol／Luna 牌價上升，倒推 token 下降；2H26 Sol 牌價不變（不分檔）
    inputs: {"INP_025": 0.9}
  # ── Z3：Compute、Cost（工作單 Z3 第 4 步：每 GW 價格、η、國產產出比、人數成長、自有資本支出、匯率）
  - id: r_price_gw_high
    description: 每 GW 價格：H800 卡時租價 13.36→18.75（阿里雲單卡時租，SRC_ZP_472）；Hopper 每 GW 價格上升，2025／1H26 供給 GW 與 η 下降，命題分母縮小
    inputs: {"SRC_ZP_474": 18.75}
  - id: s_eta_rise
    description: η 路徑開關 0→1（自 1H26 值線性移至 2030＝1）；2H26 起有效推論 GW、供給與算力成本大增
    inputs: {"INP_105": 1}
  - id: t_dom_ratio_low
    description: 國產產出比 0.6→0.4（區間下緣）；組合產能下降、token 換算 GW 上升，η 重新校準；VR 等值係數下降
    inputs: {"INP_083": 0.4}
  - id: u_headcount_high
    description: 員工人數年增率 0.1→0.3（區間上緣）；2027 起非算力成本與股權報酬上升
    inputs: {"INP_117": 0.3}
  - id: v_owned_capex
    description: 其他自有算力資本支出 0→30 億／年（2027 起）；自有 GW 自 2028 起計入供給（落後一年），算力成本含資本支出
    inputs: {"INP_111": 30}
  - id: w_dc1gw_on
    description: 1 GW 國產算力資料中心情境開關 0→1（2028 投產；2027 計資本支出）；自有 GW 0.77 超過需求配置的供給，研發殘差上升
    inputs: {"INP_112": 1}
  - id: x_fx_strong_rmb
    description: 匯率 USD/CNY 6.7399→6.4029（−5%）；持有成本、每 GW 資本支出、美元命題表與 Coding Plan 國際站價格連動
    inputs: {"INP_023": 6.4029}
  - id: y_rd_share_path
    description: 研發占比路徑開關 0→1（自 1H26 實際 0.70 線性移至 2030 目標 0.5）；供給與算力成本下降
    inputs: {"INP_120": 1}
  - id: ab_inf_fee_low
    description: 推論算力費占 API 銷售成本 1→0.22（D8r 下限）；η 上升、有效推論 GW 下降，校準期非算力成本上升（對帳仍為 0）
    inputs: {"INP_102": 0.22}
  - id: z_chip_share_broken
    description: 2027 國產 0.75→0.9、H20 0.1→0.2，Hopper＝−0.1（C43 應轉 ERR）
    inputs: {"INP_086": 0.9, "INP_092": 0.2}
  - id: aa_rd_fee_too_high
    description: 研發算力占比 0.707→1.5（超出區間）：研發算力費超過財報可容納，校準期非算力成本為負（C53、C06 應轉 ERR）
    inputs: {"INP_103": 1.5}
  - id: ac_cap_binding
    description: 壓力：訓練最低占比 0.3→0.9（超出區間，C06 應轉 ERR）；推論可用 GW 低於有效推論，2H26 起容量上限係數 <1，雲端營收截頂
    inputs: {"INP_109": 0.9}
