# Parity 情境檔（CLAUDE.md 第 3 節）。每個情境：改寫輸入 → LibreOffice 重算（基準）→ 與 engine 比對全部公式格。
# 輸入以具名範圍設定（SRC_ZP_nnn、INP_nnn、TK_*；多格名稱用 NAME[k]）。v0.1-Z2：Demand、Revenue、Checks；v0.1-Z3：Compute、Cost。
workbook_expectations:            # 版本升級時必須有意識地更新（CLAUDE.md 第 4 節）
  sheets: [README, SRC_ZP, TK_Link, OAI_Link, Inputs, Demand, Revenue, Compute, Cost, Funding, Reverse, Checks, _Defaults]
  formula_cells: 4671             # Z4：＋Funding、Reverse、Checks C68–C92、Cost 第九節（每實體 GW）
  defined_names: 1103             # Z3b 1,020 ＋ SRC 6 ＋ INP_124–135 ＋ OAI 3 ＋ FND_／RVS_ 56 ＋ COST_*_Phys 6
  src_rows: 610                   # SRC_ZP 筆數（Z1 604＋Z4 由 note 拆出 6 列：SRC_ZP_605–610）
  src_named: 661                  # SRC_ZP_nnn（有數值 576）＋_Lo（46）＋_Hi（39）
  inp_rows: 134                   # data/zhipu_inputs.yaml（Z4：＋INP_124–135）
  tk_values: 72                   # OpenAI v0.6 的 63 名 ＋ Z3b IF_CostPre／Cache／Dec_* 9 名
  tk_table: 7                     # TK_RD_（以列標籤讀表；只供對照）
  oai_named: 21                   # OAI_ 17 個輸出列（Z4＋FND_CashEnd、FND_Committed、RVS_ExtNeedCum）＋4 個中繼
  tk_pending: 0

# 預期轉 ERR 的檢查（保證檢查有牙齒）；未列出的情境不得有任何 ERR
expected_errors:
  k2_rev_total_mismatch: [C17]
  h_cp_mix_broken: [C23]
  i_cp_subs_exceed_api: [C06, C21]
  j_input_out_of_range: [C06]
  l_era_overflow: [C06, C25]
  p_sol_share_broken: [C06, C24]
  q_onprem_k_out: [C06, C26]
  z_chip_share_broken: [C43]
  aa_rd_fee_too_high: [C06, C53]
  ac_cap_binding: [C06]
  ao_mincash_out: [C06]

scenarios:
  - id: base
    description: 基準（不改任何輸入）
    inputs: {}
  - id: a_price_cut_fast
    description: 價格變動：Sol 牌價年變動率 −20%→−40%（區間下緣）；2027 起 Sol 牌價、有效單價下降，價格反應使任務數與 token 上升
    inputs: {"INP_035": -0.4}
  - id: b_elasticity_high
    description: 彈性：任務數價格彈性 −0.7→−1.05（區間下緣）；2H26 漲價使量降更多、2027 起降價使量升更多
    inputs: {"INP_045": -1.05}
  - id: c_onprem_growth
    description: 本地化成長：2027 起年增率 0%→+20%（區間上緣）；②③④與總額上升，雲端 token 不變（D4）
    inputs: {"INP_070": 0.2}
  - id: d_onprem_flat_2h26
    description: 本地化 2H26 延續係數 0→1（R2 後基準為持平；改為逐線延續上半年同比）；2026 起本地化營收上升
    inputs: {"INP_069": 1}
  - id: e_cp_mix_pro
    description: Coding Plan 組合：Lite 0.6→0.4、Pro 0.3→0.45（Max 0.15）；加權月價、訂閱營收、每訂閱者 token 上升；1H26 按量計費倒推值下降
    inputs: {"INP_055": 0.4, "INP_056": 0.45}
  - id: f_tier_mix_sol
    description: 層級組合：2026 Sol 占比 0.7→0.85；組合有效單價上升，1H26 倒推 token 下降
    inputs: {"INP_033": 0.85}
  - id: g_fx_weak_rmb
    description: 匯率：USD/CNY 6.7399→7.0769（＋5%）；國際站 Coding Plan 人民幣價、ARR 對照、TK 價格對照連動
    inputs: {"INP_023": 7.0769}
  - id: h_cp_mix_broken
    description: Coding Plan 組合 Lite 0.8＋Pro 0.45＞1，Max＜0（C23 應轉 ERR）
    inputs: {"INP_055": 0.8, "INP_056": 0.45}
  - id: i_cp_subs_exceed_api
    description: Coding Plan 1H26 訂閱者倍數 1→8（超出區間）：估計訂閱營收超過 API 實際，按量計費倒推 ≤0（C21、C06 應轉 ERR）
    inputs: {"INP_048": 8}
  - id: j_input_out_of_range
    description: 折扣與免費額度 0.25→0.6，超出高端 0.4（C06 應轉 ERR）；有效單價下降、倒推 token 上升
    inputs: {"INP_031": 0.6}
  - id: k_rev_api_2025
    description: 校準：FY2025 開放平台及 API 實際營收 1.9038→2.5（SRC_ZP_112）、營收總額同步 7.2433→7.8395（SRC_ZP_120）；按量計費倒推 token 上升，校準差距仍為 0
    inputs: {"SRC_ZP_112": 2.5, "SRC_ZP_120": 7.8395}
  - id: k2_rev_total_mismatch
    description: 只改 FY2025 開放平台及 API 實際營收（SRC_ZP_112 1.9038→2.5）、不改總額：分部合計≠年報總額（C17 應轉 ERR）
    inputs: {"SRC_ZP_112": 2.5}
  - id: l_era_overflow
