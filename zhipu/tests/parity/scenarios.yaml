    inputs: {"TK_RD_CapIn_GLM53[3]": 6.0}
  - id: n_task_growth_high
    description: 2H26 任務數成長 +224%→+300%（區間上緣；R1 後基準 2.24）；2H26 起 API token、營收、ARR 對照連動
