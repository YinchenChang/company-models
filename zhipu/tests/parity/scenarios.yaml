  - id: r_long_ctx
    description: 長上下文占比 0.6→0.9；2025、1H26 Sol／Luna 牌價上升，倒推 token 下降；2H26 Sol 牌價不變（不分檔）
    inputs: {"INP_025": 0.9}
  # ── Z3：Compute、Cost（工作單 Z3 第 4 步：每 GW 價格、η、國產產出比、人數成長、自有資本支出、匯率）
  - id: r_price_gw_high
