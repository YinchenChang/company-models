# r2 敏感度情境（招股章程 P1 後重算；Z5b 第一輪版本見 git 歷史 8c0ea1e）。tools/sensitivity_z4.py --yaml 本檔。
# 輸入鍵＝Inputs 具名範圍（INP_nnn）或 SRC_ZP_nnn；值取 Inputs 低／高欄或工作單指定。
# group：driver＝三個關鍵驅動；chat＝chat 端指定並列；fund＝融資預設；other＝其他已套用預設
scenarios:
  - {id: base, label: 基準, group: base, inputs: {}}
  # 三個關鍵驅動（P1 後依 2030 差額擺幅）
  - {id: rdfee_lo, label: 研發項下算力費占研發開支 0.6（INP_137 下緣；P1）, group: driver, inputs: {INP_137: 0.6}}
  - {id: rdfee_hi, label: 研發項下算力費占研發開支 0.8（INP_137 上緣；P1）, group: driver, inputs: {INP_137: 0.8}}
  - {id: inffee_lo, label: 營業成本計算服務費占 API 銷售成本 0.22（INP_102 下緣）, group: driver, inputs: {INP_102: 0.22}}
  - {id: px_m25, label: 每 GW 價格每年 −25%（INP_100 下緣）, group: driver, inputs: {INP_100: -0.25}}
  - {id: px_0, label: 每 GW 價格不變（INP_100 上緣 0）, group: driver, inputs: {INP_100: 0}}
  - {id: mgm_hi, label: 供應商最低毛利 0.2（INP_136 上緣；Z5b V1）, group: driver, inputs: {INP_136: 0.2}}
  - {id: eta_conv, label: η 線性收斂至 2030＝1（INP_105＝1）, group: driver, inputs: {INP_105: 1}}
  # 其他重要預設
  - {id: eta_old, label: η 舊法（D8r：token GW ÷ API 銷售成本換算 GW；INP_139＝1）, group: other, inputs: {INP_139: 1}}
  - {id: rd_05, label: 研發占比 2030 線性升至 0.5（INP_120＝1；P1 後起點 0.30）, group: other, inputs: {INP_120: 1}}
  - {id: rd_03, label: 研發占比路徑開關＝1、2030 目標 0.3（＝起點，INP_110 下緣）, group: other, inputs: {INP_120: 1, INP_110: 0.3}}
  - {id: util_hi, label: Coding Plan 額度使用率 0.4（INP_060 上緣；η 同步重校準）, group: other, inputs: {INP_060: 0.4}}
  - {id: util_lo, label: Coding Plan 額度使用率 0.05（INP_060 下緣；η 同步重校準）, group: other, inputs: {INP_060: 0.05}}
  - {id: mintrain_lo, label: 訓練最低占比 0.2（INP_109 下緣）, group: other, inputs: {INP_109: 0.2}}
  - {id: mintrain_hi, label: 訓練最低占比 0.4（INP_109 上緣）, group: other, inputs: {INP_109: 0.4}}
  - {id: cpout_hi, label: Coding Plan 輸出占比 0.08, group: other, inputs: {INP_123: 0.08}}
  - {id: apiout_hi, label: API 輸出占比 0.3, group: other, inputs: {INP_029: 0.3}}
  - {id: task_lo, label: 2H26 任務數成長 +130%（INP_038 下緣）, group: other, inputs: {INP_038: 1.3}}
  - {id: task_hi, label: 2H26 任務數成長 +300%（INP_038 上緣）, group: other, inputs: {INP_038: 3.0}}
  - {id: hc_hi, label: 員工人數年增 30%（INP_117 上緣）, group: other, inputs: {INP_117: 0.3}}
  - {id: dc1gw, label: 1 GW 國產資料中心（INP_112＝1，2028 投產）, group: other, inputs: {INP_112: 1}}
  - {id: capex50, label: 其他自有算力資本支出 50 億／年（INP_111 上緣）, group: other, inputs: {INP_111: 50}}
  - {id: dc1gw_mgm, label: 1 GW 資料中心＋最低毛利 0.2, group: other, inputs: {INP_112: 1, INP_136: 0.2}}
  - {id: stress, label: 壓力組合：η 收斂＋1 GW 資料中心＋每 GW 價格不變＋員工年增 30%, group: other, inputs: {INP_105: 1, INP_112: 1, INP_100: 0, INP_117: 0.3}}
  # 融資預設（Z4）
  - {id: cb_conv, label: 可換股債券轉股（INP_128＝1）, group: fund, inputs: {INP_128: 1}}
  - {id: bank_repay, label: 銀行借款到期償還（INP_127＝1）, group: fund, inputs: {INP_127: 1}}
  - {id: mincash12, label: 最低現金 12 個月（INP_124 上緣）, group: fund, inputs: {INP_124: 12}}
  - {id: oth_hi, label: 其他收益延續 1H26 年化 0.83 億（INP_125 上緣）, group: fund, inputs: {INP_125: 0.83}}
  - {id: only_pl1, label: 只計 IPO＋2026-07 配售（不含 2026-09 配售與可換股債券）, group: fund, inputs: {SRC_ZP_544: 0, SRC_ZP_547: 0, SRC_ZP_545: 0}}
  - {id: ipo_only, label: 只計 IPO（不含 2026-07、09 配售與可換股債券）, group: fund, inputs: {SRC_ZP_536: 0, SRC_ZP_544: 0, SRC_ZP_547: 0, SRC_ZP_545: 0}}
flips:
  # 命題 1：2030 每 VR 等值 GW 差額＝0
  - {id: f_rdfee, label: 2030 差額轉正所需研發項下算力費占比（P1；越低＝1H26 供給越小、外推算力越少）, key: INP_137, lo: 0.05, hi: 0.718, target: gap30}
  - {id: f_inffee, label: 2030 差額轉正所需營業成本計算服務費占 API 銷售成本（INP_102）, key: INP_102, lo: 0.0, hi: 1.0, target: gap30}
  - {id: f_px, label: 2030 差額轉正所需每 GW 價格年變動率（租價下限＝持有成本）, key: INP_100, lo: -0.5, hi: 0, target: gap30}
  - {id: f_mgm, label: 2030 差額轉正所需供應商最低毛利（負值＝供應商賠本出租）, key: INP_136, lo: -0.9, hi: 0, target: gap30}
  - {id: f_rd, label: 2030 差額轉正所需研發占比 2030 目標（開關＝1）, key: INP_110, lo: 0.02, hi: 0.7, target: gap30, fixed: {INP_120: 1}}
  - {id: f_task, label: 2030 差額轉正所需 2H26 任務數成長, key: INP_038, lo: 2.24, hi: 20, target: gap30}
  - {id: f_util, label: （只列，不列入翻轉點：η 同步重校準造成）2030 差額轉正所需 Coding Plan 額度使用率, key: INP_060, lo: 0.15, hi: 0.9, target: gap30}
  # 命題 2：2030 前累計外部資金需求＝0
  - {id: f_rdfee_ext, label: 2030 前不需外部資金所需研發項下算力費占比, key: INP_137, lo: 0.05, hi: 0.718, target: cum30}
  - {id: f_inffee_ext, label: 2030 前不需外部資金所需營業成本計算服務費占 API 銷售成本（INP_102）, key: INP_102, lo: 0.0, hi: 1.0, target: cum30}
  - {id: f_px_ext, label: 2030 前不需外部資金所需每 GW 價格年變動率, key: INP_100, lo: -0.5, hi: 0, target: cum30}
  - {id: f_mgm_ext, label: 出現外部資金需求的最低毛利門檻（低於此值 2030 前不需外部資金）, key: INP_136, lo: -0.5, hi: 0, target: cum30}
  - {id: f_task_ext, label: 2030 前不需外部資金所需 2H26 任務數成長, key: INP_038, lo: 2.24, hi: 20, target: cum30}
  - {id: f_rd_ext, label: 2030 前不需外部資金所需研發占比 2030 目標（開關＝1）, key: INP_110, lo: 0.02, hi: 0.7, target: cum30, fixed: {INP_120: 1}}
  - {id: f_util_ext, label: （只列）2030 前不需外部資金所需 Coding Plan 額度使用率, key: INP_060, lo: 0.15, hi: 0.9, target: cum30}
  - {id: f_cpout, label: （只列，η 同步重校準造成）2030 差額轉正所需 Coding Plan 輸出占比, key: INP_123, lo: 0.03, hi: 0.08, target: gap30}
